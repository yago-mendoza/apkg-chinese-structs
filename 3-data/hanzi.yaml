# El porqué de cada carácter del mazo, para el cuaderno web (la ficha flotante y la sección «Sus caracteres»).
# Esquema en 3-data/README.md. Lo calculable (tipo, piezas, cuál da el sonido) sale de sources/hanzi; aquí va lo
# redactado: `gloss`, `origin` (con palabras propias, nunca copiado), `traditional` si la forma simplificada esconde
# el dibujo, `confidence` (medium: origen discutido) y, solo si la fuente se equivoca, `type`/`phonetic`/`semantic`
# con `override` (el porqué). No genera tarjetas: ver docs/goal.md, «Cómo se explica un carácter».

characters:
  你:
    gloss: {es: 'tú', en: 'you'}
    origin:
      es: 'Ideograma compuesto: 亻 «persona» junto a 尔 (ěr), que en chino clásico ya significaba «tú». La persona a la que te diriges.'
      en: 'Compound ideograph: 亻 (person) beside 尔 (ěr), which already meant you in classical Chinese. The person you are speaking to.'
    confidence: high
  好:
    gloss: {es: 'bien, bueno', en: 'good'}
    origin:
      es: 'Ideograma compuesto: 女 «mujer» y 子 «niño», una madre con su hijo. La explicación tradicional lo lee como lo que está bien.'
      en: 'Compound ideograph: 女 (woman) and 子 (child), a mother with her son. The traditional reading takes it as what is good.'
    confidence: high
  再:
    gloss: {es: 'otra vez', en: 'again'}
    origin:
      es: 'El origen de su forma es discutido. Una lectura antigua lo ve como 一 «uno» sobre la mitad de 冓 (dos piezas que encajan): uno más, otra vez. Otra lectura ve en las formas antiguas dos peces.'
      en: 'The origin of its shape is disputed. An old reading sees 一 (one) over half of 冓 (two interlocking pieces): one more, again. Another reading sees two fish in the ancient forms.'
    memory:
      es: 'Dos rayas 二 sobre algo que parece una balanza: lo que se pesa por segunda vez, otra vez.'
      en: 'Two strokes 二 over something that looks like a scale: weighed a second time, again.'
    confidence: medium
  见:
    gloss: {es: 'ver; verse', en: 'to see; to meet'}
    origin:
      es: 'Ideograma compuesto: en la forma tradicional 見, un ojo 目 grande sobre unas piernas 儿, una persona que mira. La simplificación dejó el ojo irreconocible.'
      en: 'Compound ideograph: in the traditional form 見, a large eye 目 on top of legs 儿, a person looking. Simplification left the eye unrecognisable.'
    traditional: 見
    confidence: high
  拜:
    gloss: {es: 'saludar con reverencia', en: 'to bow, to pay respects'}
    origin:
      es: 'Ideograma compuesto: en las formas antiguas, una mano 手 junto a una planta con ramas, quizá llevada como ofrenda. Con el tiempo las dos mitades se igualaron y hoy parecen dos manos juntas en una reverencia. En 拜拜 imita el inglés bye-bye.'
      en: 'Compound ideograph: in the ancient forms, a hand 手 beside a leafy plant, perhaps carried as an offering. Over time both halves grew alike and now look like two hands joined in a bow. In 拜拜 it imitates English bye-bye.'
    confidence: medium
  早:
    gloss: {es: 'temprano; mañana', en: 'early; morning'}
    origin:
      es: 'Ideograma compuesto: el sol 日 sobre 十, que se suele leer como el sol asomando por encima de las ramas de un árbol. En la forma de sello la pieza de abajo era 甲 «coraza», y su lectura se discute.'
      en: 'Compound ideograph: the sun 日 above 十, usually read as the sun rising over the branches of a tree. In seal script the lower piece was 甲 (shell, armour), and its reading is disputed.'
    confidence: medium
  您:
    gloss: {es: 'usted (tú con respeto)', en: 'you (polite)'}
    origin:
      es: 'Ideograma compuesto: 你 «tú» sobre 心 «corazón», el tú dicho con consideración. Es un carácter tardío y esta lectura sirve más para recordarlo que como historia.'
      en: 'Compound ideograph: 你 (you) over 心 (heart), you said with consideration. It is a late character, and this reading is more a memory aid than history.'
    confidence: high
  们:
    gloss: {es: 'plural de personas', en: 'plural suffix for people'}
    origin:
      es: 'Fonético-semántico: 亻 «persona» da el sentido (marca un grupo de personas) y 门 (mén) el sonido: suena parecido, cambia el tono. Tradicional: 們.'
      en: 'Phonetic-semantic: 亻 (person) gives the meaning (it marks a group of people) and 门 (mén) the sound: similar, only the tone changes. Traditional: 們.'
    traditional: 們
    confidence: high
  大:
    gloss: {es: 'grande', en: 'big'}
    origin:
      es: 'Pictograma: una persona de frente con los brazos y las piernas abiertos, ocupando todo el espacio que puede.'
      en: 'Pictograph: a person seen from the front with arms and legs spread wide, taking up as much space as possible.'
    type: pictographic
    override: 'Es el dibujo de una persona entera, no una suma de 一 y 人.'
    confidence: high
  家:
    gloss: {es: 'casa, hogar; familia', en: 'home; family'}
    origin:
      es: 'Ideograma compuesto: un cerdo 豕 bajo un techo 宀, como ya se ve en los huesos oraculares; el cerdo en casa da la idea de hogar. Otros ven en 豕 una pista de sonido, aunque shǐ ya no se parece a jiā.'
      en: 'Compound ideograph: a pig 豕 under a roof 宀, as already seen on the oracle bones; the pig in the house gives the idea of home. Others take 豕 as a sound hint, though shǐ is no longer close to jiā.'
    confidence: medium
  老:
    gloss: {es: 'viejo, mayor', en: 'old'}
    origin:
      es: 'Pictograma: una persona encorvada, de pelo largo, apoyada en un bastón. Abajo, 匕 no es «cuchara»: es lo que queda del bastón y la figura doblada.'
      en: 'Pictograph: a bent person with long hair leaning on a stick. The lower 匕 is not a spoon here: it is what remains of the stick and the stooped figure.'
    confidence: high
  师:
    gloss: {es: 'maestro; experto', en: 'master; expert'}
    origin:
      es: 'Ideograma compuesto: en la forma tradicional 師, 𠂤 (un montículo, un campamento; otros lo leen como un arco) y 帀 «rodear». Significaba «tropa», un cuerpo de unos 2.500 soldados, luego su jefe y «maestro».'
      en: 'Compound ideograph: in the traditional form 師, 𠂤 (a mound, a camp; others read it as a bow) and 帀 (to surround). It meant troops, a body of about 2,500 soldiers, then their leader, and master.'
    memory:
      es: 'Es 帅 «dirigir» con un trazo encima, como un techo: el que dirige a los alumnos bajo un mismo techo. La izquierda parece 刂 pero no es un cuchillo.'
      en: 'It is 帅 (to lead) with a stroke on top, like a roof: the one who leads the students under one roof. The left side looks like 刂 but is not a knife.'
    traditional: 師
    confidence: medium
  欢:
    gloss: {es: 'alegre, contento', en: 'joyful, glad'}
    origin:
      es: 'Fonético-semántico en la forma tradicional 歡: 欠 (alguien con la boca abierta) da el sentido y 雚 (guàn) el sonido, parecido a huān. La simplificación cambió 雚 por 又, que solo sustituye.'
      en: 'Phonetic-semantic in the traditional form 歡: 欠 (someone with mouth open) gives the meaning and 雚 (guàn) the sound, close to huān. Simplification replaced 雚 with 又, a mere stand-in.'
    traditional: 歡
    type: pictophonetic
    phonetic: {char: 雚, pinyin: 'guàn'}
    semantic: 欠
    override: 'La fuente no da tipo; en la forma tradicional 歡 es fonético-semántico con 雚 como sonido.'
    confidence: high
  迎:
    gloss: {es: 'recibir, salir al encuentro', en: 'to welcome, to meet'}
    origin:
      es: 'Fonético-semántico: 辶 «andar» da el sentido (salir al camino a recibir a alguien) y 卬 (áng) el sonido, que ya no se parece a yíng en mandarín moderno.'
      en: 'Phonetic-semantic: 辶 (walking) gives the meaning (going out on the road to meet someone) and 卬 (áng) the sound, which no longer resembles yíng in modern Mandarin.'
    confidence: high
  怎:
    gloss: {es: 'cómo', en: 'how'}
    origin:
      es: 'Fonético-semántico: 心 «corazón» solo da la categoría (pensar, dudar) y 乍 (zhà) el sonido, que ya no se parece a zěn en mandarín moderno.'
      en: 'Phonetic-semantic: 心 (heart) only gives the category (thinking, doubting) and 乍 (zhà) the sound, which no longer resembles zěn in modern Mandarin.'
    confidence: high
  么:
    gloss: {es: 'partícula (什么, 怎么)', en: 'particle (什么, 怎么)'}
    origin:
      es: 'Sin historia que contar: es una partícula y se usa por su sonido. Ocupa el lugar de la forma tradicional 麼 (什麼, 怎麼).'
      en: 'No story to tell: it is a particle used for its sound. It stands in for the traditional form 麼 (什麼, 怎麼).'
    traditional: 麼
    confidence: high
  样:
    gloss: {es: 'forma, manera', en: 'shape, manner'}
    origin:
      es: 'Fonético-semántico: 木 «árbol» solo da la categoría (el sentido original era otro) y 羊 (yáng) el sonido: suena parecido, cambia el tono. Tradicional: 樣.'
      en: 'Phonetic-semantic: 木 (tree) only gives the category (the original meaning was different) and 羊 (yáng) the sound: similar, only the tone changes. Traditional: 樣.'
    traditional: 樣
    confidence: high
  晚:
    gloss: {es: 'tarde', en: 'late; evening'}
    origin:
      es: 'Fonético-semántico: 日 «sol» da el sentido (la hora del día) y 免 (miǎn) el sonido, parecido a wǎn: mismo tono, cambia el comienzo.'
      en: 'Phonetic-semantic: 日 (sun) gives the meaning (time of day) and 免 (miǎn) the sound, close to wǎn: same tone, different start.'
    type: pictophonetic
    phonetic: {char: 免, pinyin: 'miǎn'}
    semantic: 日
    override: 'La propia pista de la fuente dice que 免 da el sonido, así que es fonético-semántico.'
    confidence: high
  安:
    gloss: {es: 'tranquilo, a salvo', en: 'peaceful, safe'}
    origin:
      es: 'Ideograma compuesto: una mujer 女 bajo un techo 宀: estar en casa, en calma, a salvo.'
      en: 'Compound ideograph: a woman 女 under a roof 宀: being at home, calm and safe.'
    confidence: high
  回:
    gloss: {es: 'volver', en: 'to return'}
    origin:
      es: 'Pictograma: era una espiral, un remolino que vuelve sobre sí. Al cuadrarse la escritura quedó un cuadrado dentro de otro; no tiene que ver con 口 «boca».'
      en: 'Pictograph: it was a spiral, a whirl turning back on itself. When writing became square it turned into a box inside a box; it has nothing to do with 口 (mouth).'
    type: pictographic
    override: 'Era el dibujo de una espiral, no la suma de dos cuadros.'
    confidence: high
  来:
    gloss: {es: 'venir', en: 'to come'}
    origin:
      es: 'Pictograma: la forma tradicional 來 dibuja una planta de trigo con sus espigas. «Venir» es un préstamo: la palabra sonaba igual y se tomó el dibujo del trigo.'
      en: 'Pictograph: the traditional form 來 draws a wheat plant with its ears. To come is a loan: the word sounded the same, so the wheat drawing was borrowed.'
    traditional: 來
    type: pictographic
    override: 'Es el dibujo de una planta de trigo, no una combinación de piezas.'
    confidence: high
  啊:
    gloss: {es: 'partícula que suaviza o anima', en: 'softening particle'}
    origin:
      es: 'Fonético-semántico: 口 «boca» marca una palabra hablada, una interjección, y 阿 (ā) el sonido: suena parecido, cambia el tono.'
      en: 'Phonetic-semantic: 口 (mouth) marks a spoken word, an interjection, and 阿 (ā) gives the sound: similar, only the tone changes.'
    confidence: high
  谢:
    gloss: {es: 'agradecer', en: 'to thank'}
    origin:
      es: 'Fonético-semántico: 讠 «palabra» da el sentido (las gracias se dan hablando) y 射 (shè) el sonido, parecido a xiè: mismo tono, cambia la inicial. Tradicional: 謝.'
      en: 'Phonetic-semantic: 讠 (speech) gives the meaning (thanks are spoken) and 射 (shè) the sound, close to xiè: same tone, different initial. Traditional: 謝.'
    traditional: 謝
    confidence: high
  请:
    gloss: {es: 'por favor; invitar', en: 'please; to invite'}
    origin:
      es: 'Fonético-semántico: 讠 «palabra» da el sentido (pedir, invitar) y 青 (qīng) el sonido: suena parecido, cambia el tono. Tradicional: 請.'
      en: 'Phonetic-semantic: 讠 (speech) gives the meaning (asking, inviting) and 青 (qīng) the sound: similar, only the tone changes. Traditional: 請.'
    traditional: 請
    confidence: high
  对:
    gloss: {es: 'correcto; frente a', en: 'right, correct; facing'}
    origin:
      es: 'Ideograma en la forma tradicional 對: una mano 寸 que sostiene un objeto con ramas sobre la tierra; se ha leído como plantar algo como es debido, pero se discute. La simplificación cambió la izquierda por 又, que solo sustituye.'
      en: 'Ideograph in the traditional form 對: a hand 寸 holding a branched object over the earth; it has been read as planting something properly, but this is disputed. Simplification replaced the left part with 又, a mere stand-in.'
    memory:
      es: 'Dos manos, 又 y 寸, que se estrechan al ponerse de acuerdo: correcto.'
      en: 'Two hands, 又 and 寸, shaking on an agreement: right, correct.'
    traditional: 對
    confidence: medium
  的:
    gloss: {es: 'partícula de posesión', en: 'possessive particle'}
    origin:
      es: 'Sin historia que contar como partícula: se usa por su sonido. El carácter significaba «claro» y «diana» (aún se lee dì en 目的), con 白 «blanco» y 勺 como parte fonética.'
      en: 'No story to tell as a particle: it is used for its sound. The character meant bright and target (still read dì in 目的), with 白 (white) and 勺 as its sound part.'
    type: pictophonetic
    phonetic: {char: 勺, pinyin: 'sháo'}
    semantic: 白
    override: 'La fuente no da tipo; el carácter antiguo lleva 白 como sentido y 勺 como sonido.'
    confidence: high
  问:
    gloss: {es: 'preguntar', en: 'to ask'}
    origin:
      es: 'Fonético-semántico: 口 «boca» da el sentido (preguntar es hablar) y 门 (mén) el sonido, parecido a wèn: cambia la inicial y el tono. Tradicional: 問.'
      en: 'Phonetic-semantic: 口 (mouth) gives the meaning (asking is speaking) and 门 (mén) the sound, close to wèn: initial and tone change. Traditional: 問.'
    traditional: 問
    confidence: high
  进:
    gloss: {es: 'entrar', en: 'to enter'}
    origin:
      es: 'Fonético-semántico: 辶 «andar» da el sentido y 井 (jǐng) el sonido, parecido a jìn: cambian el tono y el final. La forma tradicional, 進, llevaba un pájaro 隹 en lugar de 井.'
      en: 'Phonetic-semantic: 辶 (walking) gives the meaning and 井 (jǐng) the sound, close to jìn: tone and ending change. The traditional form 進 had a bird 隹 instead of 井.'
    traditional: 進
    confidence: high
  坐:
    gloss: {es: 'sentarse', en: 'to sit'}
    origin:
      es: 'Ideograma compuesto: dos personas 人 sentadas en el suelo 土, una frente a otra. Juntas parecen 从 «seguir», pero aquí no lo son.'
      en: 'Compound ideograph: two people 人 sitting on the ground 土, facing each other. Together they look like 从 (to follow), but here they are not.'
    confidence: high
  是:
    gloss: {es: 'ser', en: 'to be'}
    origin:
      es: 'El origen de su forma es discutido. En bronce se ve una pieza parecida a 早 sobre 止 «pie»; después, 日 «sol» sobre una forma de 正 «recto». Una lectura antigua es «lo recto», lo correcto, de donde pasó a «ser».'
      en: 'The origin of its shape is disputed. In bronze script a piece like 早 sits over 止 (foot); later, 日 (sun) over a form of 正 (straight). An old reading is what is straight, correct, from which it came to mean to be.'
    memory:
      es: 'Obrar recto 正 a plena luz del sol 日, sin nada que ocultar: lo correcto, lo que es.'
      en: 'Acting straight 正 in full sunlight 日, with nothing to hide: what is right, what is.'
    confidence: medium
  嗯:
    gloss: {es: 'mm, sí (asentimiento)', en: 'mm-hm (agreement)'}
    origin:
      es: 'Fonético-semántico: 口 «boca» marca un sonido de la boca, una interjección, y 恩 (ēn) el sonido: suena parecido, cambia el tono.'
      en: 'Phonetic-semantic: 口 (mouth) marks a sound made with the mouth, an interjection, and 恩 (ēn) gives the sound: similar, only the tone changes.'
    confidence: high
  可:
    gloss: {es: 'poder; aprobar', en: 'can; to approve'}
    origin:
      es: 'Fonético-semántico en la explicación clásica: 口 «boca» da el sentido (decir que sí) y el gancho 丂 (kǎo) el sonido, parecido a kě: cambia la vocal. La fuente lo reparte al revés.'
      en: 'Phonetic-semantic in the classical account: 口 (mouth) gives the meaning (saying yes) and the hook 丂 (kǎo) the sound, close to kě: the vowel changes. The source splits it the other way.'
    phonetic: {char: 丂, pinyin: 'kǎo'}
    semantic: 口
    override: 'La explicación clásica da a 口 el sentido y a 丂 el sonido; la fuente los reparte al revés.'
    confidence: medium
  以:
    gloss: {es: 'con, mediante', en: 'with, by means of'}
    origin:
      es: 'El origen de su forma es discutido. En los huesos oraculares se ha leído como una persona con una herramienta de labranza parecida a 耜 (una reja de arado), o como algo que alguien lleva. Hoy es una palabra gramatical.'
      en: 'The origin of its shape is disputed. On the oracle bones it has been read as a person with a farming tool like 耜 (a ploughshare), or as something a person carries. Today it is a grammatical word.'
    confidence: medium
  不:
    gloss: {es: 'no', en: 'not'}
    origin:
      es: 'El origen de su forma es discutido: unos ven el cáliz de una flor, otros raíces bajo el suelo. «No» es un uso por su sonido. Se aprende de memoria.'
      en: 'The origin of its shape is disputed: some see the calyx of a flower, others roots under the ground. Not is a use borrowed for its sound. Learned by heart.'
    memory:
      es: 'Compáralo con 才, un brote que ya atraviesa la tierra 一: en 不 la planta se queda debajo y no sale. No.'
      en: 'Compare it with 才, a sprout already breaking through the ground 一: in 不 the plant stays below and does not come out. Not.'
    confidence: medium
  意:
    gloss: {es: 'idea, intención', en: 'idea, intention'}
    origin:
      es: 'Ideograma compuesto: 音 «sonido, voz» sobre 心 «corazón», lo que dice el corazón: la idea, la intención. También se ha visto 音 (yīn) como pista de sonido, parecido a yì.'
      en: 'Compound ideograph: 音 (sound, voice) over 心 (heart), what the heart says: idea, intention. 音 (yīn) has also been taken as a sound hint, close to yì.'
    confidence: medium
  思:
    gloss: {es: 'pensar', en: 'to think'}
    origin:
      es: 'Ideograma compuesto: arriba no hay un campo 田, sino una forma alterada de 囟, la coronilla; abajo 心 «corazón». Cabeza y corazón juntos: pensar.'
      en: 'Compound ideograph: the top is not a field 田 but an altered form of 囟, the crown of the head; below, 心 (heart). Head and heart together: to think.'
    confidence: high
  起:
    gloss: {es: 'levantarse', en: 'to rise, to get up'}
    origin:
      es: 'Fonético-semántico: 走 «andar» da el sentido (ponerse en pie para moverse) y 己 (jǐ) el sonido, parecido a qǐ: mismo tono, cambia la inicial.'
      en: 'Phonetic-semantic: 走 (walking) gives the meaning (getting up to move) and 己 (jǐ) the sound, close to qǐ: same tone, different initial.'
    confidence: high
  没:
    gloss: {es: 'no (no pasó; no hay)', en: 'not (did not; there is not)'}
    origin:
      es: 'Fonético-semántico: 氵 «agua» y una pieza que se leía mò, parecida a méi, dibujada como un remolino sobre una mano: alguien que se hunde e intenta agarrar algo. Hundirse, desaparecer, no haber. Hoy la derecha parece 殳.'
      en: 'Phonetic-semantic: 氵 (water) and a piece read mò, close to méi, drawn as a whirlpool over a hand: someone sinking and reaching for something. To sink, vanish, not have. Today the right side looks like 殳.'
    memory:
      es: 'Una lanza 殳 que se hunde en el agua 氵 y desaparece: ya no hay nada.'
      en: 'A spear 殳 sinking into the water 氵 and vanishing: nothing is left.'
    traditional: 沒
    phonetic: {char: 𠬛, pinyin: 'mò'}
    override: 'La parte derecha solo se parece a 殳; históricamente es 𠬛, que se leía mò.'
    confidence: medium
  关:
    gloss: {es: 'cerrar; paso', en: 'to close; pass'}
    origin:
      es: 'Fonético-semántico en la forma tradicional 關: 門 «puerta» da el sentido (cerrar con tranca) y la pieza de dentro el sonido. La simplificación quitó la puerta, así que 关 no se explica a simple vista.'
      en: 'Phonetic-semantic in the traditional form 關: 門 (gate) gives the meaning (barring it shut) and the inner piece the sound. Simplification removed the gate, so 关 cannot be read at a glance.'
    traditional: 關
    type: pictophonetic
    semantic: 門
    override: 'La fuente no da tipo; en la forma tradicional 關 es fonético-semántico, con 門 como sentido.'
    confidence: high
  系:
    gloss: {es: 'atar; sistema', en: 'to tie; system'}
    origin:
      es: 'Pictograma: hilos de seda 糸 sujetos por un trazo arriba, que se suele leer como una mano: atar, enlazar. En 关系 ocupa el lugar de la forma tradicional 係.'
      en: 'Pictograph: silk threads 糸 held by a stroke on top, usually read as a hand: to tie, to link. In 关系 it stands in for the traditional form 係.'
    type: pictographic
    override: 'La fuente lo marca fonético-semántico sin pieza de sonido; se explica mejor como dibujo de hilos.'
    confidence: high
  客:
    gloss: {es: 'invitado', en: 'guest'}
    origin:
      es: 'Fonético-semántico: 宀 «techo» da el sentido (alguien acogido en casa) y 各 (gè) el sonido, parecido a kè: mismo tono, cambia la inicial.'
      en: 'Phonetic-semantic: 宀 (roof) gives the meaning (someone taken into the house) and 各 (gè) the sound, close to kè: same tone, different initial.'
    type: pictophonetic
    phonetic: {char: 各, pinyin: 'gè'}
    semantic: 宀
    override: 'La propia pista de la fuente dice que 各 da el sonido, así que es fonético-semántico.'
    confidence: high
  气:
    gloss: {es: 'aire, gas; ánimo', en: 'air, gas; spirit'}
    origin:
      es: 'Pictograma: líneas de vapor o de nubes que flotan. La forma tradicional, 氣, añade debajo 米 «arroz».'
      en: 'Pictograph: lines of vapour or cloud drifting. The traditional form 氣 adds 米 (rice) underneath.'
    traditional: 氣
    type: pictographic
    override: 'Es el dibujo de líneas de vapor; la pieza 亻 de la fuente no existe en el carácter.'
    confidence: high
  帮:
