  - id: p.third-tone-half
    use: say
    theme: sonidos
    kind: pronunciation
    title: El tercer tono, a medias
    explanation: 'Delante de un 1.º, 2.º, 4.º o neutro, el tercer tono solo baja y no vuelve a subir: en 老师 la sílaba lǎo solo
      baja. El tercer tono completo aparece sobre todo en una sílaba aislada o con énfasis.'
    audio_text: 老师
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: 2026-09-25}
