# Diccionario personal. Una entrada por sentido/lectura; el ID no cambia al corregir.
# kind: word | expression | character | component | pronunciation | group
# standalone (por sentido, no por hanzi): yes | rare | no — si ese sentido se usa solo como palabra.
# group.basis: visual (se parecen) | homophone (mismo sonido) | pattern (misma pieza de formación)
#   members: [{ref, cue}] — cue es el rasgo que distingue o lo que aporta. Máximo 4 para contraste.
# comments[].kind: mnemonic (subjetivo) | teacher (profesora) | linguistic (verificado)
#   | note (apunte literal de YAGO, de origen sin precisar)
# comments[].private: true por defecto; los privados no salen en ninguna exportación.
# AVISO: el repositorio remoto es público. No guardar aquí comentarios privados
# hasta hacerlo privado o mover esos comentarios a private/.

# use: read | hear | say (escalera) o excepción con use_reason: lista ([read], [hear]…), context
#   (solo dentro de frases) o drop (descartada). role: content | function. theme: id de themes.
version: 1

themes:  # orden de aprendizaje; decide el orden de las nuevas y los archivos de 5-guide/
  - {id: sonidos, title: Sonidos y tonos}
