  - id: g.wu-day-parts
    theme: tiempo
    kind: group
    basis: pattern
    title: 上 / 中 / 下 + 午
    piece: c.wu.noon
    explanation: 午 es el mediodía; 上 lo pone antes, 中 en el centro y 下 después.
    members:
      - {ref: w.shangwu, cue: 上 antes del mediodía}
      - {ref: w.zhongwu, cue: 中 en el mediodía}
      - {ref: w.xiawu, cue: 下 después del mediodía}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: 2026-09-25}
    comments: []

  - id: g.day-parts
    kind: group
    basis: set
    theme: tiempo
    title: Partes del día
    explanation: Con 午 «mediodía» se forman las tres del centro (上 antes, 中 en, 下 después); la noche va aparte.
    members:
      - {ref: w.shangwu, cue: '上 «arriba, antes» + 午'}
      - {ref: w.zhongwu, cue: '中 «en medio» + 午'}
      - {ref: w.xiawu, cue: '下 «abajo, después» + 午'}
      - {ref: w.wanshang, cue: '晚 «tarde, noche»; sin 午'}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-07-12.txt, date: 2026-09-25}
    comments: []

  - id: p.third-tone-sandhi
    use: say
    theme: sonidos
    kind: pronunciation
    title: Dos terceros tonos seguidos
    explanation: >-
      Cuando dos sílabas en tercer tono van seguidas, la primera se pronuncia
      como segundo tono. Se sigue escribiendo el tono de referencia:
      你好 se escribe nǐ hǎo y suena como ní hǎo.
    audio_text: 你好
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: 2026-09-25}
    comments: []

