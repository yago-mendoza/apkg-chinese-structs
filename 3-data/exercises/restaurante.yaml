exercises:
  - id: x.compose.pedir-en-el-restaurante
    added: '2026-11-11'
    lang: es
    type: compose
    targets: [s.bu-dabao-zai-zheli-chi, s.wo-yao-jiaozi-hai-yao-tang, s.yigong-duoshao-qian]
    words: [w.dabao, w.chi, w.yao, w.hai.also, w.yigong, w.duoshao]
    skills: [production, speaking]
    prompt: {text: 'Construye. En un restaurante chino: di cuántos sois y que coméis aquí (no para llevar); pide un plato de carne, uno de arroz o fideos y una bebida; pregunta cuánto es y paga. Al menos seis frases.'}
    answer: {meaning: 'Tres piezas para pedir: aquí o para llevar, lo que quieres (还要 para añadir) y cuánto es en total.'}
    comments: []
  - id: x.compose.hacer-de-camarero
    added: '2026-11-11'
    lang: es
    type: compose
    targets: [s.nihao-jiwei, s.zai-zheli-chi-haishi-dabao, s.hai-yao-biede-ma]
    words: [e.nihao, w.wei.cl, w.chi, w.dabao, w.hai.also, w.yao]
    skills: [production, speaking]
    prompt: {text: 'Construye. Ahora eres el camarero: saluda, pregunta cuántos son y si es para tomar aquí o para llevar, dales la carta y pregunta si quieren algo más.'}
    answer: {meaning: 'Lo que dice el camarero, en orden.'}
    comments: []
  - id: x.nuance.hai-still-also
    added: '2026-11-11'
    lang: es
    type: nuance
    targets: [w.hai.also, w.hai.still]
    skills: [comprehension, discrimination]
    prompt: {text: '我还没吃饭 y 我要饺子，还要汤: ¿qué hace 还 en cada una?'}
    answer: {meaning: 'En la primera, «todavía»: aún no he comido. En la segunda, «además, también»: suma algo más a lo que pides.'}
