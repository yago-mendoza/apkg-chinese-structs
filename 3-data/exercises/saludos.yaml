  - id: x.nuance.how-are-you
    added: 2026-10-05
    lang: es
    type: nuance
    targets: [e.zuijinzenmeyang, w.zenmeyang]
    context: [e.nihaoma, e.nihaihaoma, e.chifanlema, e.zuijinmangma]
    skills: [comprehension, discrimination]
    prompt: {text: '你好吗, 你怎么样, 最近怎么样, 你还好吗, 吃饭了吗 y 最近忙吗: ¿cuándo cada uno?'}
    answer: {meaning: '最近怎么样？ «¿qué tal últimamente?»: la más versátil, para cualquiera que conoces. 你怎么样？ «¿y tú qué tal?»: se entiende, pero suelto suena algo directo; va bien después de contar lo tuyo. 你好吗？ «¿cómo estás?»: correcto, de libro. 你还好吗？ «¿estás bien?»: solo si algo ha pasado; sin motivo, alarma. 吃饭了吗？ «¿has comido?»: saludo de vecinos y familia, no una invitación; se contesta 吃了，你呢？. 最近忙吗？ «¿mucho lío?»: interés por algo concreto, muy natural.'}
    comments: []
  - id: x.nuance.zaijian-dajiahao
