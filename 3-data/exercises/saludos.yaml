    skills: [comprehension, discrimination]
    prompt: {text: '再见 y 大家好: ¿cuál es para llegar y cuál para irte, y en qué se distinguen al oído?'}
    answer: {meaning: '大家好 «hola a todos» abre: al empezar a hablar ante un grupo. 再见 «adiós» cierra: al irte. Al oído: 再见 empieza por z (una ts sin aire) y son dos cuartos tonos que caen; 大家好 empieza por d y son tres sílabas, cuarto, primero y tercero.'}
