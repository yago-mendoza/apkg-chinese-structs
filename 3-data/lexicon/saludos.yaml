    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: '回 «volver» + 来 «hacia aquí». 你回来了！ es un saludo al ver llegar a alguien de casa o del trabajo.'}
      - {kind: linguistic, private: false, date: '2026-10-11', text: '回 «volver» + 来 «hacia aquí»: volver adonde está quien habla. Venir solo se puede hacia aquí, así que el 来 pone el «aquí». 我回来了 «ya estoy aquí».', original: 'y luego que juntos huilai es ''volver aqui'' algo asi, y el aqui se repsenrta con ''venir'', que no se puede venir a otra parte (''venir'') que no sea ''aqui'' por el hablante'}
