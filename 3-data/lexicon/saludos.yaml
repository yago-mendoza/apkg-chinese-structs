  - id: g.hao-greetings
    kind: group
    basis: pattern
    title: Saludos con 好
    piece: w.hao
    explanation: A quien saludas + 好. El registro cambia según a quién te diriges.
    members:
      - {ref: e.nihao, cue: una persona; neutro}
      - {ref: e.ninhao, cue: una persona mayor o de respeto (您)}
      - {ref: e.nimenhao, cue: un grupo que tienes delante; relajado}
      - {ref: e.dajiahao, cue: todo el mundo; más amplio y formal}
      - {ref: e.laoshihao, cue: 'a la profesora: el cargo + 好'}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: 2026-09-25}
    comments:
      - {kind: note, private: false, date: 2026-09-25, text: '您们 nínmen suena forzado y apenas se usa: para saludar con respeto a un grupo, 大家好 dàjiā hǎo o 各位好 gèwèi hǎo [HSK 3]. 你们好 nǐmen hǎo: relajado, para un grupo de amigos que tienes delante. 大家好 dàjiā hǎo: para dirigirse a todo el mundo, más formal.', original: 'nínmen hǎo → respectful w/ seniors / teachers; nǐmen hǎo → relaxed, friends (grupo delante de mí); dàjiā hǎo → formal, group (todo el mundo)'}
