    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: '你好吗？ es correcto, pero de libro; para preguntar cómo está alguien suena más natural 你怎么样？. También pide opinión: 这个怎么样？ «¿qué tal este?».'}
