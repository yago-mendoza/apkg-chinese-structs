# Entradas · En el restaurante. Esquema: 3-data/README.md

entries:
  - id: w.caidan
    use: say
    role: content
    kind: word
    hanzi: 菜单
    pinyin: càidān
    meaning: {es: 'carta, menú', en: menu}
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: linguistic, private: false, text: '菜 «plato, comida» + 单 «lista»: la lista de platos. El mismo 单 de 买单 «la cuenta».'}
      - {date: '2026-11-11', kind: teacher, private: false, text: 'En clase: 这是菜单。你吃什么？, lo primero que dice el camarero después de sentarte.'}
  - id: w.maidan
    use: say
    role: content
    kind: word
    pos: verbo
    hanzi: 买单
    pinyin: mǎidān
    meaning: {es: pagar la cuenta; ¡la cuenta!, en: to pay the bill}
    level: 2
    level_reason: no está en la lista; de todos los días en un restaurante, y 买 es HSK 1
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: usage, private: false, text: 'Para pedir la cuenta basta con decirlo: 买单！ o, más amable, 不好意思，买单！. Para pagar tú: 我买单 «pago yo».'}
      - {date: '2026-11-11', kind: linguistic, private: false, text: '买 «comprar» + 单 «la cuenta (la lista)». Ojo: 买 mǎi «comprar», tercer tono; 卖 mài «vender», cuarto.'}
  - id: w.wei.cl
    use: say
    role: content
    kind: word
    pos: clasificador
    hanzi: 位
    pinyin: wèi
    meaning: {es: 'clasificador cortés de personas (en un restaurante: ¿cuántos sois?)', en: polite measure word for people}
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: usage, private: false, text: 'Al entrar en un restaurante te preguntan 几位？ «¿cuántos sois?» y contestas 两位 «dos». Es el 个 cortés: 一位老师 «un profesor».'}
      - {date: '2026-11-11', kind: teacher, private: false, text: 'En clase, la primera frase del camarero: 你好，几位？.'}
  - id: w.dabao
    use: say
    use_reason: de clase y de todos los días en un restaurante, aunque sea HSK 5
    role: content
    kind: word
    hanzi: 打包
    pinyin: dǎbāo
    meaning: {es: para llevar; envolver lo que sobra para llevártelo, en: to pack (food) to take away}
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: usage, private: false, text: 'Al pedir, 在这里吃还是打包？ «¿para tomar aquí o para llevar?». Al acabar, 可以打包吗？ «¿me lo pone para llevar?»: en China es normal llevarse lo que sobra.'}
      - {date: '2026-11-11', kind: linguistic, private: false, text: '打 «hacer (algo con las manos)» + 包 «paquete, bolsa»: hacer un paquete.'}
  - id: w.yigong
    use: say
    role: content
    kind: word
    hanzi: 一共
    pinyin: yígòng
    meaning: {es: en total, en: 'altogether, in total'}
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: usage, private: false, text: '一共多少钱？ «¿cuánto es en total?», al pagar varias cosas.'}
  - id: w.hai.also
    use: context
    use_reason: 'otro sentido de un carácter que ya se lee y se oye: se practica en sus frases'
    role: function
    kind: word
    hanzi: 还
    pinyin: hái
    meaning: {es: 'además, también (para añadir algo más)', en: 'also, in addition'}
    relations: [w.hai.still]
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: teacher, private: false, text: 'Anotado en clase: 还要 = «también, y además». 我要饺子，还要汤 «quiero jiaozi, y también sopa».'}
      - {date: '2026-11-11', kind: linguistic, private: false, text: 'El mismo 还 de «todavía» (我还没吃饭), aquí para sumar: 还要别的吗？ «¿algo más?».'}
  - id: w.lai.order
    use: context
    use_reason: 'otro sentido de un carácter que ya se lee y se oye: se practica en sus frases'
    role: content
    kind: word
    hanzi: 来
    pinyin: lái
    meaning: {es: '(al pedir) póngame, tráigame', en: (when ordering) I'll have}
    relations: [w.lai]
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: teacher, private: false, text: 'Anotado en clase: 来 para pedir, 来一个… «uno de…».'}
      - {date: '2026-11-11', kind: usage, private: false, text: 'Al pedir, 来 + cantidad + cosa: 来一杯可乐 «una cola», 再来一杯水 «otro vaso de agua». Es muy de diario; 我要… también vale.'}
  - id: w.dian.order
    use: context
    use_reason: 'otro sentido de un carácter que ya se lee y se oye: se practica en sus frases'
    role: content
    kind: word
    hanzi: 点
    pinyin: diǎn
    meaning: {es: 'pedir (comida, en un restaurante)', en: to order (food)}
    relations: [w.dian.oclock]
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: linguistic, private: false, text: 'El mismo 点 de las horas (三点), aquí «señalar en la carta»: 点菜 «pedir los platos». 你们点什么？ «¿qué van a pedir?».'}
  - id: w.fen.cl
    use: say
    role: content
    kind: word
    pos: clasificador
    hanzi: 份
    pinyin: fèn
    meaning: {es: 'una ración, un plato (clasificador)', en: portion (measure word)}
    source: {origin: review, batch: 017-2026-11-11-pedir-en-el-restaurante, file: review-016-2026-11-06-improvisar-y-la-clase-del-6.md, date: '2026-11-11', with_class: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: usage, private: false, text: 'Para pedir platos: 一份饺子 «una de jiaozi», 两份米饭 «dos de arroz».'}
  - id: w.shuaka
    use: say
    role: content
    kind: word
    pos: verbo
    hanzi: 刷卡
    pinyin: shuākǎ
    meaning: {es: pagar con tarjeta, en: to pay by card}
    level: 3
    level_reason: no está en la lista; 卡 es HSK 2 y es de todos los días al pagar
    source: {origin: review, batch: 017-2026-11-11-pedir-en-el-restaurante, file: review-016-2026-11-06-improvisar-y-la-clase-del-6.md, date: '2026-11-11', with_class: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: linguistic, private: false, text: '刷 «pasar (como un cepillo)» + 卡 «tarjeta»: pasar la tarjeta. En China casi todo se paga con el móvil: 扫码.'}
  - id: w.meinv
    use: say
    use_reason: 'de clase: así se llama a la camarera en un restaurante'
    role: content
    kind: word
    hanzi: 美女
    pinyin: měinǚ
    meaning: {es: '(para llamar a una camarera o dependienta joven) ¡oye!, ¡perdona!', en: (to call a young woman serving) miss}
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: teacher, private: false, text: 'Anotado en clase con 帅哥: para llamar al que te atiende.'}
      - {date: '2026-11-11', kind: usage, private: false, text: 'Literalmente «chica guapa», pero al llamar a una camarera o dependienta joven es solo un «¡perdona!» amable: 美女，买单！. 服务员！ también vale.'}
  - id: w.shuaige
    use: say
    role: content
    kind: word
    hanzi: 帅哥
    pinyin: shuàigē
    meaning: {es: '(para llamar a un camarero joven) ¡oye!, ¡perdona!', en: (to call a young man serving) hey}
    level: 4
    level_reason: no está en la lista; va con 美女, que es HSK 4
    source: {origin: class, batch: 017-2026-11-11-pedir-en-el-restaurante, file: hoja de clase 2026-11-09, date: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: teacher, private: false, text: 'Anotado en clase con 美女: para llamar al camarero.'}
      - {date: '2026-11-11', kind: linguistic, private: false, text: '帅 «guapo» + 哥 «hermano mayor», el de 哥哥: «guapo». Al llamar a un camarero joven es un «¡perdona!» amable.'}
  - id: w.manyi
    use: hear
    role: content
    kind: word
    hanzi: 满意
    pinyin: mǎnyì
    meaning: {es: 'satisfecho, contento (con algo)', en: satisfied}
    source: {origin: review, batch: 017-2026-11-11-pedir-en-el-restaurante, file: review-016-2026-11-06-improvisar-y-la-clase-del-6.md, date: '2026-11-11', with_class: '2026-11-09'}
    comments:
      - {date: '2026-11-11', kind: linguistic, private: false, text: '满 «lleno» + 意 «intención, idea»: lo que querías, colmado. 还满意吗？ «¿todo bien?», te pregunta el camarero.'}
  - id: g.fen-fen
    kind: group
    basis: soundalike
    title: 分 fēn y 份 fèn
    explanation: 'Solo los separa el tono: se distinguen de oído por cómo sube o baja la voz.'
    members:
      - {ref: w.fen.minute, cue: 'alto y plano: 五分钟'}
      - {ref: w.fen.cl, cue: 'cae: 一份饺子'}
    source: {origin: review, batch: 017-2026-11-11-pedir-en-el-restaurante, file: review-016-2026-11-06-improvisar-y-la-clase-del-6.md, date: '2026-11-11'}
    comments: []
