    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Para añadir algo: 还有，我明天不来 «y otra cosa: mañana no vengo». En una tienda, 还有吗？ «¿queda más?».'}
  - id: w.huozhe
    use: say
    role: function
    kind: word
    hanzi: 或者
    pinyin: huòzhě
    meaning: {es: 'o (dando opciones, sin preguntar)', en: 'or (offering options)'}
    source: {origin: review, batch: 014-2026-10-26-duplicados-diagramas-y-recuadros, file: review-013-2026-10-23-pagar-opinar-y-contrastes.md, date: '2026-10-26'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-26', text: '或者 da opciones sin preguntar: 水或者茶都可以 «agua o té, me da igual». Para preguntar «¿esto o aquello?» se usa 还是: 你要水还是茶？.', original: 'Para empezar: «¿A o B?» → 还是. «A o B está bien» → 或者.'}
  - id: g.you-you
    kind: group
    basis: set
    title: '有 yǒu, 又 yòu y 右 yòu'
    explanation: 'Las tres son you: 有 lleva tercer tono; 又 y 右 suenan igual y las separa la frase.'
    members:
      - {ref: w.you.have, cue: 'baja y sube (3.º): 我有姐姐'}
      - {ref: w.you.repeat, cue: 'cae (4.º), delante del verbo: 他又来了'}
      - {ref: w.you.right, cue: 'cae (4.º), lado: 左右'}
    source: {origin: review, batch: 011-2026-10-16-clase-primero-edad-y-opiniones, file: 'review-010-2026-10-11-construir-numeros-y-movimiento.md', date: '2026-10-16'}
    comments:
      - {kind: note, private: false, date: '2026-10-26', text: 'Se queda como serie, sin tarjeta de contraste propia: 又 y 右 suenan igual, así que se preguntan por el significado en el contraste de 有, 又, 要 y 右.'}
  - id: g.danshi-haishi
    kind: group
    basis: soundalike
    title: 但是 y 还是
    explanation: 'Acaban igual, en shi; el primero opone, el segundo dice que algo no cambia.'
    members:
      - {cue: 'une dos frases que chocan: 我很累，但是我想去', ref: w.danshi}
      - {cue: 'algo sigue igual pese a todo: 我还是很累', ref: w.haishi}
    source: {batch: 015-2026-10-31-volver-a-casa-y-para-entender, date: '2026-10-31', file: review-014-2026-10-26-duplicados-diagramas-y-recuadros.md, origin: review}
    comments: []
