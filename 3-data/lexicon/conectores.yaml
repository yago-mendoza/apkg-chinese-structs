entries:
  - id: w.yinwei
    use: say
    role: function
    kind: word
    hanzi: 因为
    pinyin: 'yīnwèi'
    meaning: {es: 'porque', en: 'because'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments: []
  - id: w.suoyi
    use: say
    role: function
    kind: word
    hanzi: 所以
    pinyin: 'suǒyǐ'
    meaning: {es: 'así que, por eso', en: 'so'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Va con 因为: 因为下雨，所以我不去. En chino se dicen los dos, la causa primero.'}
  - id: w.ruguo
    use: say
    role: function
    kind: word
    hanzi: 如果
    pinyin: 'rúguǒ'
    meaning: {es: 'si (condición)', en: 'if'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments: []
  - id: w.jiu
    use: say
    role: function
    kind: word
    hanzi: 就
    pinyin: 'jiù'
    meaning: {es: 'entonces (consecuencia)', en: 'then'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Tras 如果, marca la consecuencia, detrás del sujeto: 如果你喜欢，就买吧. En inglés se omite el «then»; en chino suele decirse.'}
  - id: w.suiran
    use: hear
    role: function
    kind: word
    hanzi: 虽然
    pinyin: 'suīrán'
    meaning: {es: 'aunque', en: 'although'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments: []
  - id: w.danshi
    use: say
    role: function
    kind: word
    hanzi: 但是
    pinyin: 'dànshì'
    meaning: {es: 'pero', en: 'but'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Con 虽然 se dicen los dos: 虽然很累，但是我很高兴.'}
  - id: w.yibian
    use: say
    role: function
    kind: word
    hanzi: 一边
    pinyin: 'yībiān'
    meaning: {es: 'mientras (一边…一边…)', en: 'while'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: '一边 + verbo + 一边 + verbo: dos cosas a la vez, 他一边吃一边说. Así se dice «leo y tomo té»: 和 no une acciones.', original: 'instead of im readning and dirnking tea seria NO decir wo zai kan shu huo he cha sino wo zai kan shu, he cha una coma.¿? asi ¿?'}
  - id: w.ba.particle
    use: say
    role: function
    kind: word
    hanzi: 吧
    pinyin: 'ba'
    meaning: {es: 'partícula de propuesta (venga, vale)', en: 'suggestion particle'}
    connection: {kind: sound, with: [爸], text: '巴 bā da el sonido a 吧 ba y a 爸 bà.'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Al final, convierte la frase en propuesta: 我们下午见吧 «nos vemos por la tarde, ¿vale?»; 买吧 «cómpralo».'}
      - {kind: mnemonic, private: false, date: '2026-10-11', text: '吧 es como el «va» de «vinga, va»: anima a hacerlo, sin mandar.', original: 'el ''ba'' de zou ba m recuerda al ''va'' en caltan, de ''vinga, va'' sabes ¿? ayuda a entneder un poco mas no?¿'}
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Tres usos: propone (我们走吧 «vámonos»), suaviza una orden (你坐吧 «siéntate, anda») y supone (你累了吧？ «estarás cansado, ¿no?»). 走吧 sin sujeto vale para «vámonos» y para «vete»: 我们走吧, 你走吧.'}
  - id: g.ba-ba
    kind: group
    basis: soundalike
    title: '八 bā y 吧 ba'
    explanation: '八 es alto y plano; 吧 es átono, corto, al final de la frase.'
    members:
      - {ref: w.ba, cue: 'alto y plano'}
      - {ref: w.ba.particle, cue: 'átono, corto, al final'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments: []
  - id: w.zai.again
    use: say
    role: function
    kind: word
    hanzi: 再
    pinyin: zài
    meaning: {es: 'otra vez, de nuevo; luego, después', en: 'again; then'}
    relations: [w.zaijian, e.zaishuoyibian]
    source: {origin: inbox, batch: 005-2026-10-05-saludos-y-sonidos, file: 2026-10-05_pegado-en-el-chat.md, date: '2026-10-05'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-05', text: 'Es el 再 de 再见 «adiós», literalmente «volver a ver», y de 再说一遍 «dilo otra vez». Va delante del verbo y habla de algo que aún no ha pasado: 我明天再来 «vuelvo mañana».'}
  - id: g.zai-zai
    kind: group
    basis: homophone
    title: '在 y 再: los dos zài'
    explanation: 'Suenan igual, con el mismo cuarto tono; la frase decide.'
    members:
      - {ref: w.zai.at, cue: '我在家'}
      - {ref: w.zai.again, cue: '再见, 再说一遍'}
    source: {origin: inbox, batch: 005-2026-10-05-saludos-y-sonidos, file: 2026-10-05_pegado-en-el-chat.md, date: '2026-10-05'}
    comments: []
  - id: w.yexu
    use: hear
    role: content
    kind: word
    hanzi: 也许
    pinyin: 'yěxǔ'
    meaning: {es: 'quizá', en: 'perhaps'}
    source: {origin: class, batch: 008-2026-10-08-pedir-ayuda-lugares-y-finales, file: deberes 2026-10-08, date: '2026-10-08'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-08', text: 'Va delante del verbo: 也许他不来 «quizá no venga».'}
      - {kind: character, private: false, date: '2026-10-08', text: '午 wǔ da el sonido a 许 xǔ: mismo tono, aunque hoy la vocal es otra (xu lleva ü).'}
  - id: e.haoba
    use: say
    role: content
    kind: expression
    hanzi: 好吧
    pinyin: hǎo ba
    meaning: {es: 'bueno, vale (aceptando)', en: 'well, OK'}
    level: 1
    level_reason: 好 y 吧 son HSK 1; respuesta muy corriente.
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Palabra a palabra: 好 «bien» + 吧 «venga». Aceptas, a veces sin muchas ganas: «bueno, vale». 好的 es un «vale» sin más.'}
  - id: g.zai-zhen
    kind: group
    basis: visual
    title: 再 y 真
    explanation: Los dos son una caja con rayas; se separan por arriba y por abajo.
    members:
      - {ref: w.zai.again, cue: una raya larga arriba y otra que atraviesa la caja}
      - {ref: w.zhen, cue: 'abajo, dos patitas'}
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments: []
  - id: w.you.repeat
    use: say
    role: function
    kind: word
    hanzi: 又
    pinyin: 'yòu'
    meaning: {es: 'otra vez (lo que ya ha pasado)', en: 'again (already happened)'}
    source: {origin: review, batch: 011-2026-10-16-clase-primero-edad-y-opiniones, file: 'review-010-2026-10-11-construir-numeros-y-movimiento.md', date: '2026-10-16'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-16', text: '又 cuenta una repetición que ya ha ocurrido: 他又来了 «ha vuelto a venir». Para lo que aún no ha pasado se usa 再: 我明天再来.'}
  - id: g.you-you
    kind: group
    basis: soundalike
    title: '有 yǒu, 又 yòu y 右 yòu'
    explanation: 'Las tres son you: 有 lleva tercer tono; 又 y 右 suenan igual y las separa la frase.'
    members:
      - {ref: w.you.have, cue: 'baja y sube (3.º): 我有姐姐'}
      - {ref: w.you.repeat, cue: 'cae (4.º), delante del verbo: 他又来了'}
      - {ref: w.you.right, cue: 'cae (4.º), lado: 左右'}
    source: {origin: review, batch: 011-2026-10-16-clase-primero-edad-y-opiniones, file: 'review-010-2026-10-11-construir-numeros-y-movimiento.md', date: '2026-10-16'}
    comments: []
