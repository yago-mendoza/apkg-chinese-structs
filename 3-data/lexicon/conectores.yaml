    hanzi: 好吧
    pinyin: hǎo ba
    meaning: {es: 'bueno, vale (aceptando)', en: 'well, OK'}
    level: 1
    level_reason: 好 y 吧 son HSK 1; respuesta muy corriente.
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Palabra a palabra: 好 «bien» + 吧 «venga». Aceptas, a veces sin muchas ganas: «bueno, vale». 好的 es un «vale» sin más.'}
  - id: g.zai-zhen
    kind: group
    basis: visual
    title: 再 y 真
    explanation: Los dos son una caja con rayas; se separan por arriba y por abajo.
    members:
      - {ref: w.zai.again, cue: una raya larga arriba y otra que atraviesa la caja}
      - {ref: w.zhen, cue: 'abajo, dos patitas'}
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments: []
  - id: w.you.repeat
    use: say
    role: function
    kind: word
    hanzi: 又
    pinyin: 'yòu'
    meaning: {es: 'otra vez (lo que ya ha pasado)', en: 'again (already happened)'}
    source: {origin: review, batch: 011-2026-10-16-clase-primero-edad-y-opiniones, file: 'review-010-2026-10-11-construir-numeros-y-movimiento.md', date: '2026-10-16'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-16', text: '又 cuenta una repetición que ya ha ocurrido: 他又来了 «ha vuelto a venir». Para lo que aún no ha pasado se usa 再: 我明天再来.'}
  - id: w.haishi
    use: say
    role: function
    kind: word
    hanzi: 还是
    pinyin: háishi
    meaning: {es: o (en una pregunta entre dos), en: or (in questions)}
    source: {origin: review, batch: 012-2026-10-19-querer-poder-y-matices, file: review-011-2026-10-16-clase-primero-edad-y-opiniones.md, date: '2026-10-19'}
    accept_pinyin_mismatch: '是 va en tono neutro: háishi'
    accept_cards: 'pasa el tope por los contrastes y matices que pidió YAGO en sus notas del review 013 (lote 014)'
    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Solo en preguntas que dan a elegir: 你喝茶还是喝咖啡？ «¿tomas té o café?». La pregunta ya está en 还是: no lleva 吗.'}
      - {kind: linguistic, private: false, date: '2026-10-26', text: '还是 tiene otro uso: «aun así, sigo», 我还是不懂 «sigo sin entenderlo». Y en 他今年还是学生 son 还 «todavía» + 是 «ser»: «sigue siendo estudiante».', original: 'Háishi también tiene otros dos usos habituales: Wǒ háishi bù dǒng. → Sigo sin entender.'}
      - {date: '2026-10-31', kind: tip, private: false, text: '还 hái, 还是 háishi: 我还不懂 «todavía no lo entiendo»; 我还是不懂 «aun así, sigo sin entenderlo», después de que te lo expliquen. 你要水还是茶？ «¿agua o té?» (eliges); 水或者茶都可以 «agua o té, me da igual».'}
