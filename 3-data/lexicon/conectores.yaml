    comments: []
  - id: e.duile
    use: say
    role: content
    kind: expression
    hanzi: 对了
    pinyin: duì le
    meaning: {es: 'por cierto; ¡ah, ya!', en: by the way}
    level: 1
    level_reason: muy de conversación; 对 y 了 son HSK 1
    source: {origin: review, batch: 016-2026-11-06-improvisar-y-la-clase-del-6, file: review-015-2026-10-31-volver-a-casa-y-para-entender.md, date: '2026-11-06'}
    comments:
      - {date: '2026-11-06', kind: usage, private: false, text: 'Para cambiar de tema o acordarte de algo: 对了，你明天有时间吗？ «por cierto, ¿tienes tiempo mañana?». 也对 es otra cosa: «eso también es verdad».'}
      - {date: '2026-11-06', kind: linguistic, private: false, text: 'Palabra a palabra: 对 «correcto» + 了, el cambio: «¡ah, cierto!», algo que acaba de venirte a la cabeza.'}
  - id: w.hui.will
