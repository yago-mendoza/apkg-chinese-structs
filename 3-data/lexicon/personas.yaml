  - id: c.shi.master
    use: read
    kind: character
    hanzi: 师
    pinyin: shī
    meaning: {es: maestro; experto (en nombres de profesiones), en: master; expert (in job names)}
    standalone: 'no'
    level: 1
    level_reason: 'ligada de 老师 [HSK 1]'
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'Da nombre a profesiones y a quien enseña: 老师 lǎoshī, 工程师 gōngchéngshī, 厨师 chúshī «cocinero» [HSK 3]. «Experto» en general es otra palabra: 专家 zhuānjiā [HSK 3].', original: shī (se añade a algo para singifcar experto de ... enseñanza (laoshi) o experto de ingenieria (gongchcahon... o ...}
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'No se confunde con 者 zhě, «el que hace»: 作者 zuòzhě «autor», 记者 jìzhě «periodista» [HSK 3]. 师 es un oficio; 者, quien hace una acción.'}
      - {kind: mnemonic, private: false, date: '2026-09-27', text: 'El maestro dirige a los alumnos bajo techo, con el pañuelo 巾 como en 帅.', original: Ahora el profesor dirige 帅 a los estudiantes bajo techo / lelvandio pañuelo}
