    basis: visual
    title: 生, 牛 y 午
    explanation: Los tres empiezan con un trazo inclinado arriba a la izquierda. Fíjate en las horizontales y en si el vertical
      sobresale.
    members:
      - {ref: c.sheng.life, cue: 'tres horizontales; la de abajo, la más larga'}
      - {ref: w.niu, cue: dos horizontales; el vertical sobresale por arriba}
      - {ref: c.wu.noon, cue: dos horizontales; el vertical no sobresale}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments: []
  - id: g.ren-ru-ba
    kind: group
    basis: visual
    title: 人, 入 y 八
    explanation: Dos trazos en los tres; cambia cuál domina y si se tocan.
    members:
      - {ref: w.ren, cue: el trazo izquierdo es el largo; el derecho sale de su mitad}
      - {ref: c.ru.enter, cue: 'el trazo derecho es el largo; el izquierdo, corto, sale de su punta'}
      - {ref: w.ba, cue: los dos trazos no se tocan}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-07-12.txt, date: '2026-09-23'}
    comments: []
  - id: c.side.ren
    use: context
    use_reason: 'componente: se ve dentro de 你, 他, 们'
    kind: component
    hanzi: 亻
    pinyin: rén
    meaning: {es: persona (forma de 人 a la izquierda), en: person (side form of 人)}
    real_word: {hanzi: 人, pinyin: rén, es: '亻 es 人 «persona» escrito estrecho para caber a la izquierda (你, 们, 他). La palabra es 人.'}
    level: 1
    level_reason: 'aparece en 你 y 他 [HSK 1]'
    accept_pinyin_mismatch: forma lateral de 人
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments: []
  - id: c.side.shou
    use: read
    kind: component
    hanzi: 扌
    pinyin: shǒu
    meaning: {es: mano (forma de 手 a la izquierda), en: hand (side form of 手)}
    real_word: {hanzi: 手, pinyin: shǒu, es: '扌 es 手 «mano» encogido a la izquierda, en acciones que se hacen con la mano (打, 找). La palabra es 手, como en 手机.'}
    level: 1
    level_reason: 'aparece en 打 [HSK 1]'
    accept_pinyin_mismatch: 'forma lateral de 手, se lee como 手'
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'Lleva la idea de acción con la mano: 打 «golpear, jugar», 找 zhǎo «buscar» [HSK 1].'}
  - id: c.side.mu
    use: read
    kind: component
    hanzi: 木
    pinyin: mù
    meaning: {es: 'árbol, madera (a la izquierda)', en: 'tree, wood (on the left)'}
    real_word: {hanzi: 树, pinyin: shù, es: 'Suelto, 木 apenas se usa al hablar. «Árbol» es 树, y «madera», 木头 mùtou [HSK 3].'}
    level: 1
    level_reason: 'aparece en 机 de 手机 [HSK 1]'
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'En 机 jī «máquina» la pieza de la izquierda es 木, no 扌: las máquinas eran de madera.'}
  - id: g.mu-shou
    kind: group
    basis: visual
    title: 木 y 扌 a la izquierda
    explanation: 'A la izquierda se parecen: 木 tiene la raya vertical recta y dos patas; 扌, un gancho abajo y la raya de arriba cruzada.'
    members:
      - {ref: c.side.mu, cue: 'árbol: vertical recta con dos patas, como en 机'}
      - {ref: c.side.shou, cue: 'mano: vertical con gancho, como en 打'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments: []
  - id: c.side.yi
    use: read
    kind: component
    hanzi: 衤
    pinyin: yī
    meaning: {es: ropa (forma de 衣 a la izquierda), en: clothing (side form of 衣)}
    real_word: {hanzi: 衣服, pinyin: yīfu, es: '衤 es 衣 «ropa» a la izquierda; tiene un trazo más que 礻. La ropa, al hablar, es 衣服.'}
    level: 2
    level_reason: 'aparece en 裤子 kùzi «pantalón» [HSK 2]'
    accept_pinyin_mismatch: forma lateral de 衣
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'En ropa: 裤子 kùzi «pantalón» [HSK 2], 衬衫 chènshān «camisa» [HSK 3].'}
  - id: c.side.shi
    use: read
    kind: component
    hanzi: 礻
    pinyin: shì
    meaning: {es: altar (forma de 示 a la izquierda), en: altar (side form of 示)}
    real_word: {es: '礻 es 示 «altar» a la izquierda, en caracteres de culto y de suerte. A veces solo da el sonido, como en 视 shì de 电视. No corresponde a ninguna palabra del día a día.'}
    level: 1
    level_reason: 'aparece en 视 de 电视 [HSK 1]'
    accept_pinyin_mismatch: forma lateral de 示
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'En lo ritual y lo que se muestra: 视 de 电视 diànshì «televisión» [HSK 1], 神 shén «espíritu» [HSK 5].'}
  - id: g.yi-shi
    kind: group
    basis: visual
    title: 衤 y 礻
    explanation: 'Solo cambia un trazo: 衤 lleva dos puntos a la derecha; 礻, uno.'
    members:
      - {ref: c.side.yi, cue: 'dos puntos: ropa'}
      - {ref: c.side.shi, cue: 'un punto: altar, espíritu'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments: []
  - id: c.bei.shell
    use: read
    kind: component
    hanzi: 贝
    pinyin: bèi
    meaning: {es: concha (el dinero antiguo), en: shell (ancient money)}
    real_word: {hanzi: 钱, pinyin: qián, es: 'Las conchas fueron dinero, por eso 贝 sale en caracteres de comprar y de valor (贵 de 您贵姓 «caro, honorable»). El dinero, hoy, es 钱.'}
    level: 1
    level_reason: 'aparece en 贵 guì «caro» [HSK 1]'
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'Las conchas fueron dinero: de ahí 贵 guì «caro», 买 mǎi «comprar» (forma antigua) y 货 huò «mercancía».'}
  - id: g.jian-bei
    kind: group
    basis: visual
    title: 见 y 贝
    explanation: 'Arriba el mismo marco; abajo, piernas o patas.'
    members:
      - {ref: w.jian, cue: 'piernas 儿 abajo: ver'}
      - {ref: c.bei.shell, cue: 'dos patas cortas 八 abajo: concha, dinero'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments: []
  - id: c.hu.door
    use: read
    kind: component
    hanzi: 户
    pinyin: hù
    meaning: {es: puerta de una hoja; hogar, en: single door; household}
    real_word: {hanzi: 门, pinyin: mén, es: 'Suelto, 户 apenas se usa: la puerta, al hablar, es 门. 户 sale como clasificador de hogares (三户人家).'}
    as_word: {es: 'hogar, casa (clasificador de hogares: 三户人家)'}
    level: 4
    level_reason: 'aparece en 窗户 chuānghu «ventana» [HSK 4]'
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: '户 es una sola hoja; 门, las dos. Aparece en 窗户 chuānghu «ventana» [HSK 4] y 账户 zhànghù «cuenta bancaria» [HSK 6].'}
  - id: g.men-hu
    kind: group
    basis: visual
    title: 门 y 户
    explanation: 'Dos puertas: 门 tiene dos hojas; 户, una sola con un punto encima.'
    members:
      - {ref: w.men, cue: 'dos hojas: puerta, mén'}
      - {ref: c.hu.door, cue: 'una hoja con un punto: hù, hogar, ventana'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments: []
  - id: c.side.yan
    use: context
    use_reason: 'componente: se ve en 认识, 请 y 谢谢'
    kind: component
    hanzi: 讠
    pinyin: yán
    meaning: {es: 'palabra, hablar (forma de 言 a la izquierda)', en: speech (side form of 言)}
    real_word: {hanzi: 说, pinyin: shuō, es: '讠 es 言 «palabra» a la izquierda, en todo lo que tiene que ver con hablar (说, 请, 认识). «Hablar, decir» es 说, y «lo que se dice», 话 huà [HSK 1].'}
    level: 1
    level_reason: 'aparece en 认识, 请 y 谢谢 [HSK 1]'
    accept_pinyin_mismatch: forma lateral de 言
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'Casi siempre trae la idea de hablar: 认识, 请, 谢谢, 说 shuō «decir». No confundir con 文 wén «escritura» de 中文.'}
  - id: c.side.bing
    use: context
    use_reason: 'componente: se ve dentro de 疼 y de 瘦'
    kind: component
    hanzi: 疒
    pinyin: nè
    meaning: {es: 'enfermedad (como componente)', en: 'sickness radical'}
    real_word: {hanzi: 病, pinyin: bìng, es: '疒 marca enfermedad y dolor (疼). «Enfermedad» es 病, y «ponerse enfermo», 生病 shēngbìng [HSK 1].'}
    level: 3
    level_reason: 'componente; se reconoce cuando llegan 病 bìng [HSK 2] y 疼 téng [HSK 2]'
    source: {origin: attic, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27', rescued: 003-2026-10-01-comer-dinero-y-contrastes}
    comments:
      - {kind: mnemonic, private: false, date: '2026-09-27', text: 'Una cama con una persona tumbada: lo que lo lleva tiene que ver con la enfermedad, como 疼 «doler» y 瘦 «delgado».'}
