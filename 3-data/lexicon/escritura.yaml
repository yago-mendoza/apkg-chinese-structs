  - id: c.kou.mouth
    use: read
    kind: component
    hanzi: 口
    pinyin: kǒu
    meaning: {es: boca (como componente), en: mouth (component)}
    real_word: {hanzi: 嘴, pinyin: zuǐ, es: 'Suelto, 口 no es la boca al hablar: es clasificador de personas en una familia (三口人) y «entrada» en 门口 o 入口. La boca es 嘴, o 嘴巴 zuǐba [HSK 4].'}
    as_word: {es: 'clasificador de personas en una familia (三口人); «entrada» en 门口 y 入口'}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments:
      - {kind: note, private: false, date: 2026-09-25, text: 'Como componente, aparece en caracteres relacionados con la boca o con hablar, como 叫 o 吗.', original: boca habla}
  - id: c.rou.flesh
    use: read
    kind: component
    hanzi: 月
    pinyin: yuè
    meaning: {es: forma de 月 «luna»; en partes del cuerpo viene de 肉 «carne», en: flesh radical}
    real_word: {hanzi: 月亮, pinyin: yuèliang, es: 'Suelto, 月 es «mes» (一月, 这个月). La luna, al hablar, es 月亮.'}
    as_word: {es: 'mes (一月, 这个月)'}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-07-12.txt, date: '2026-09-23'}
    comments:
      - {kind: note, private: false, date: 2026-09-25, text: 'Como componente, 月 suele ser 肉 «carne» y no «luna»: aparece en partes del cuerpo, como 胖 o 脸.', original: moon + meat / “radical” → 月 = muscle}
  - id: c.mu.eye
    use: read
    kind: component
    hanzi: 目
    pinyin: mù
    meaning: {es: ojo (como componente), en: eye (component)}
    real_word: {hanzi: 眼睛, pinyin: yǎnjing, es: '目 es la palabra clásica para «ojo» y hoy solo vive dentro de palabras (看 lleva un ojo debajo de una mano). Al hablar se dice 眼睛: 眼 «ojo» y 睛 «pupila».'}
    level: 1
    level_reason: 'aparece en 看 [HSK 1]'
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments: []
  - id: g.sheng-niu-wu
