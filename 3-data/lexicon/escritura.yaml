  - id: c.nv.woman
    use: read
    kind: component
    hanzi: 女
    pinyin: nǚ
    meaning: {es: mujer (como componente), en: woman (component)}
    real_word: {hanzi: 女人, pinyin: nǚrén, es: 'Suelto, 女 casi solo va delante de otra palabra y significa «femenino» (女儿 «hija»). «Mujer», al hablar, es 女人.'}
