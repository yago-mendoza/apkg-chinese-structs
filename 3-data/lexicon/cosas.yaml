      - {kind: sound, private: false, date: '2026-10-01', text: 'cuò: la u apenas suena, se desliza hacia la o.', original: 'Cuò decir que la "u" apenas suena en notas'}
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Estar equivocado: 我错了 «me he equivocado» (también vale para «he cometido un error»), 你错了 «te equivocas». Detrás de un verbo, «mal»: 你说错了 «lo has dicho mal». 不错 bú cuò [HSK 2] es un elogio, «no está mal, bastante bien».'}
      - {kind: mnemonic, private: false, date: '2026-10-19', text: 'Un concurso: el presentador golpea una campana de metal 钅 delante del marcador 昔 y grita «¡cuò!», con un tono que cae de golpe, como el cuarto: ¡error!', original: 'Imagina un concurso donde un presentador sostiene una campana de metal y alguien da una respuesta equivocada. El presentador golpea la campana y grita: «¡CUÒ! ¡ERROR!»'}
      - {kind: mnemonic, private: false, date: '2026-10-20', text: 'Un arma de asta 钅 sobre una rejilla metálica 昔: en la fábrica se equivocaron con ese lote.', original: 'menmtenica para error, una arma de asta sobre una rejilla metalica, se puedne haber equivocado al fabircar ese lote, me gusta esta mnemtoenica'}
