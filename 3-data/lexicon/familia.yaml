    kind: word
    hanzi: 爸爸
    pinyin: bàba
    meaning: {es: papá, en: dad}
    accept_pinyin_mismatch: tono neutro en la segunda sílaba en el habla estándar; los diccionarios dan el tono de cita
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments:
      - {kind: note, private: false, date: '2026-10-01', text: 'Frente a 妈妈 māma: 爸 bà cae; 妈 mā va alto y plano. La segunda sílaba de las dos es corta y floja (tono neutro).'}
  - id: w.mama
    use: say
    role: content
    kind: word
    hanzi: 妈妈
    pinyin: māma
    meaning: {es: mamá, en: mom}
    accept_pinyin_mismatch: tono neutro en la segunda sílaba en el habla estándar; los diccionarios dan el tono de cita
    connection: {kind: sound, with: [吗], text: '马 mǎ «caballo» da el sonido a 妈 mā y a 吗 ma: el caballo solo presta su sonido.'}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments:
      - {kind: linguistic, private: false, date: 2026-09-25, text: '女 «mujer» aporta el significado y 马 mǎ, el sonido. 马 significa
          «caballo», pero aquí solo presta su sonido: el caballo no tiene nada que ver con mamá.'}
      - {kind: linguistic, private: false, date: 2026-09-26, text: 'También se dice 妈 mā sola, sobre todo para llamarla (妈！).
          爸妈 bàmā son papá y mamá juntos, en registro coloquial.'}
      - {kind: note, private: false, date: '2026-10-01', text: 'Frente a 爸爸 bàba: 妈 mā va alto y plano; 爸 bà cae. La segunda sílaba de las dos es corta y floja (tono neutro).', original: 'En el de mama bama baba ebserva los tonos y ponlo de manifesto contrastando'}
  - id: w.erzi
    use: say
    role: content
    kind: word
    hanzi: 儿子
    pinyin: érzi
    meaning: {es: hijo, en: son}
