  - id: g.hao-nver-erzi
    kind: group
    basis: visual
    title: '好, 女儿 y 儿子'
    explanation: 'Las mismas piezas en distinto orden: 女 «mujer», 子 «niño» y 儿 «niño pequeño».'
    members:
      - {ref: w.hao, cue: '女 + 子 en un solo carácter'}
      - {ref: w.nver, cue: '女 delante, 儿 detrás'}
      - {ref: w.erzi, cue: '儿 delante, 子 detrás'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments: []
  - id: w.jia
    use: say
    role: content
    kind: word
    hanzi: 家
    pinyin: jiā
    meaning: {es: 'casa, hogar; familia', en: 'home; family'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat.md, date: '2026-10-01'}
    comments:
      - {kind: character, private: false, date: '2026-10-01', text: '宀 «techo» + 豕 shǐ «cerdo»: según la explicación tradicional, la casa era donde se criaba el cerdo.'}
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'De casa pasa a familia y a establecimiento; por eso es también el clasificador de negocios: 一家饭店 «un restaurante», 一家商店 «una tienda», 一家公司 [HSK 2] «una empresa».'}
