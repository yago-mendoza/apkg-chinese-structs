    comments:
      - {kind: note, private: false, date: '2026-09-27', text: 'En 儿子 no hace falta marcar el género: es la forma por defecto; en 女儿 sí, con 女.', original: el hjio no hace falta poner su genero proque es bovio es basico es lo que dan por default}
  - id: w.nver
    use: say
    role: content
    kind: word
    hanzi: 女儿
    pinyin: nǚ'ér
    meaning: {es: hija, en: daughter}
