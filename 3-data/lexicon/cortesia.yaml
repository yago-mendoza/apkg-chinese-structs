# Diccionario · Cortesía y respuestas. Esquema: 3-data/README.md

entries:
  - id: e.xiexie
    use: say
    role: content
    kind: expression
    hanzi: 谢谢
    pinyin: xièxie
    meaning: {es: gracias, en: thank you}
    register: neutral
    source: {origin: class, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    frequency: {}
    relations: []
    accept_pinyin_mismatch: segunda sílaba en tono neutro en el habla estándar
    comments:
      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Palabra a palabra: 谢 «agradecer», repetido: la repetición lo hace más amable.'}
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'A 谢谢 se responde 不客气 o 不用谢. 没关系 es para 对不起, y 没问题, para un favor que te piden.'}
  - id: w.qing
    use: say
    role: content
    kind: word
    hanzi: 请
    pinyin: qǐng
    meaning: {es: por favor, en: please}
    source: {origin: class, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments:
      - {kind: linguistic, private: false, date: 2026-09-25, text: 'Fórmula cortés: 请您 + verbo, «le ruego que…». Por ejemplo, 请您进 qǐng nín jìn, «pase, por favor».', original: 'qǐng nín [verbo] = please you <do smth> (formal)'}
      - {kind: character, private: false, date: '2026-09-27', text: '请 = 讠 «hablar» + 青 qīng, que da el sonido. La misma pista en 清 qīng «claro» [HSK 6], 晴 qíng «despejado» [HSK 2] y 情 qíng «sentimiento» [HSK 7]; lo que aporta 青 es el sonido, no un significado de «claridad».', original: 'verde azul da como claridad y speech claridad o algo asi ?'}
  - id: w.dui
    use: say
    role: content
    kind: word
    pos: adjetivo
    pos_reason: 'en el mazo es «correcto, eso es»; la lista lo da antes como preposición («hacia, para»)'
    hanzi: 对
    pinyin: duì
    meaning: {es: 'correcto; sí, eso es', en: 'right, correct'}
    source: {origin: class, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments:
      - {kind: note, private: false, date: 2026-09-25, text: 'Variante más natural en conversación: 对啊 duì a.', original: duì a / méi cuò (+ intenso)}
      - {kind: sound, private: false, date: '2026-10-08', text: 'Suena casi «duei», alargando la e.', original: 'dui sonuds like dueee'}
  - id: e.haode
    use: say
    role: content
    kind: expression
    hanzi: 好的
    pinyin: hǎo de
    meaning: {es: 'vale, de acuerdo', en: OK}
    level: 1
    level_reason: respuesta básica; 好 y 的 son HSK 1
    source: {origin: class, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Palabra a palabra: 好 «bien» + 的: «bien, vale».'}
      - {kind: note, private: false, date: 2026-09-25, text: 'Expresa acuerdo o conformidad: «vale», «muy bien», «de acuerdo».', original: 'subjetivo, muy bien, gusto'}
  - id: e.qingwen
    use: say
    role: content
    kind: expression
    hanzi: 请问
    pinyin: qǐngwèn
    meaning: {es: disculpe (para preguntar), en: excuse me (before asking)}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'Palabra a palabra: 请 «por favor» + 问 wèn «preguntar»: la forma cortés de abrir una pregunta a alguien.'}
  - id: e.qingjin
    use: say
    role: content
    kind: expression
    hanzi: 请进
    pinyin: qǐng jìn
    meaning: {es: 'pase, por favor', en: 'come in, please'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Palabra a palabra: 请 «por favor» + 进 «entrar».'}
  - id: e.qingzuo
    use: say
    role: content
    kind: expression
    hanzi: 请坐
    pinyin: qǐng zuò
    meaning: {es: 'siéntese, por favor', en: please sit down}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Palabra a palabra: 请 «por favor» + 坐 «sentarse».'}
  - id: e.shide
    use: say
    role: content
    kind: expression
    hanzi: 是的
    pinyin: shì de
    meaning: {es: 'sí, eso es', en: 'yes, that''s right'}
    level: 1
    level_reason: respuesta afirmativa de cada día; 是 y 的 son HSK 1
    source: {origin: class, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-29'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Palabra a palabra: 是 «ser» + 的: «así es».'}
  - id: w.en
    use: say
    role: content
    kind: word
    pos: interjeccion
    hanzi: 嗯
    pinyin: èn
    meaning: {es: 'mm, sí (asentimiento)', en: mm-hm (agreement)}
    level: 1
    level_reason: 'muletilla oral de asentimiento, muy frecuente al hablar'
    accept_pinyin_mismatch: 'como asentimiento se dice cayendo, èn; pypinyin da ń, la lectura de «¿eh?»'
    source: {origin: class, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-29'}
    comments:
      - {kind: mnemonic, private: false, date: '2026-10-19', text: 'Una boca 口 junto a un corazón 心 con alguien dentro: el «mm» de quien escucha sin decir nada; según el tono, sí, extrañeza o «me da igual».', original: 'El èn es lit 嗯 tipo boca y corazon y un palitroque de una persona tipo el inocente que te deja como, mm, sabes, indiferente etre extañado t te da igual'}
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Repetido, 嗯嗯 es el «ajá, ajá» de quien sigue la conversación; dicho seco, puede sonar a indiferencia.'}
  - id: w.keyi
    use: say
    role: content
    kind: word
    hanzi: 可以
    pinyin: kěyǐ
    meaning: {es: 'poder (está permitido); vale, sirve', en: 'can, may; OK'}
    accept_cards: '会, 能 y 可以 con el mismo verbo, la confusión central de su examen del review 011'
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: note, private: false, date: '2026-09-29', text: 'También sirve de «vale», como 好的.', original: kê yî = okay (like ke ài) (its liek phnetical calco)}
      - {kind: linguistic, private: false, date: '2026-09-27', text: '可 delante de un verbo lo vuelve «-able»: 可以 «se puede», 可爱 «mono, adorable», 可怕 kěpà «temible» [HSK 2].'}
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Pregunta y respuesta a la vez: 可以吗？ —可以。 «¿Se puede? —Sí». En una tienda, 这个大小可以吗？ «¿este tamaño está bien?». Según el contexto también se dice 行 xíng [HSK 1] o 没问题 méi wèntí [问题 HSK 2], «no hay problema».', original: 'En kêyî hay que explcar que no es lo mismo poder tener permiso que 能 (néng): poder / ser capaz de. [...] keyi estaria bien hacer hincapie en que est tanto "poder" para preguntas como respuesta como ... loksea, y expresiones sinonimss segun ctx sabes'}
      - {kind: mnemonic, private: false, date: '2026-10-09', text: 'Kěyǐ suena un poco a «can», «poder» en inglés.', original: Sound a bit like can  (jeje pa recorfar)}
  - id: g.yes-forms
    kind: group
    basis: set
    title: Formas de decir que sí
    explanation: 'El chino no tiene un «sí» único: se confirma según lo que se responde.'
    members:
      - {ref: w.dui, cue: 'tienes razón'}
      - {ref: e.shide, cue: 'confirma un hecho'}
      - {ref: e.haode, cue: 'aceptas algo'}
      - {ref: e.meicuo, cue: 'más enfático que 对'}
      - {ref: w.en, cue: 'te sigo, mientras el otro habla'}
    source: {origin: class, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-29'}
    comments: []
  - id: e.buhaoyisi
    use: say
    role: content
    kind: expression
    hanzi: 不好意思
    pinyin: bù hǎoyìsi
    meaning: {es: 'perdona; qué vergüenza; me sabe mal', en: 'sorry, excuse me; how embarrassing'}
    accept_pinyin_mismatch: 'la última sílaba es átona: yìsi'
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Palabra a palabra: 不 «no» + 好意思 «tener cara para algo»: «no tengo cara», qué apuro.'}
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Para una molestia pequeña: llegar tarde, pasar, interrumpir, pedir algo. Es muy cotidiano, también entre jóvenes, y no suena formal.'}
  - id: w.duibuqi
    use: say
    role: content
    kind: word
    hanzi: 对不起
    pinyin: duìbuqǐ
    accept_pinyin_mismatch: 'el 不 de en medio es átono en el habla: duìbuqǐ'
    meaning: {es: lo siento, en: "I'm sorry"}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-06', text: '对得起 es estar a la altura con alguien; 对不起, no estarlo: te he fallado, perdón.'}
      - {kind: mnemonic, private: false, date: '2026-10-09', text: '对不起 empieza por 对 «sí, correcto»: al pedir perdón juntas las manos, como quien afirma y reza. El que empieza por 不 «no», 不客气, es la mano que dice que no: «no hay de qué».', original: 'Cuando digo duibuqi y bukeqi me confundo. Duibuqi, bukeqi. Pero si lo pienso, el que empieza por bu, que es no. Si lo hago con la mano, como diciendo que no con la mano, es como de nada, está claro. Bukeqi. Pero si digo duibuqi, pedir perdón es como juntar las manos, como si fuera a rezar, lo cual se parece más a afirmar algo, como dui. Dui. Dui. Duibuqi. y así me acuerdo. Podrías apuntar eso en la card que toque'}
  - id: g.excuse
    kind: group
    basis: set
    title: 'Disculpe, perdona y lo siento'
    explanation: 'Tres formas de pedir perdón o de abordar a alguien, según la situación.'
    members:
      - {ref: e.qingwen, cue: 'antes de preguntar algo: 请问，饭店在哪里？'}
      - {ref: e.buhaoyisi, cue: 'una molestia pequeña: llegar tarde, pasar, pedir algo'}
      - {ref: w.duibuqi, cue: 'has hecho algo mal'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat.md, date: '2026-10-01'}
    comments: []
  - id: e.meiguanxi
    use: say
    role: content
    kind: expression
    hanzi: 没关系
    pinyin: 'méi guānxi'
    meaning: {es: 'no pasa nada', en: 'it''s OK, never mind'}
    accept_pinyin_mismatch: 'la última sílaba es átona: guānxi'
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'La respuesta a 对不起 o a 不好意思: «no pasa nada».'}
      - {kind: linguistic, private: false, date: '2026-10-06', text: 'Palabra a palabra: 没 «no hay» + 关系 [HSK 3] «relación»: no tiene que ver, no importa. Para quitar importancia a algo que ha pasado; para aceptar algo que te piden, 没问题.'}
      - {kind: mnemonic, private: false, date: '2026-10-09', text: 'Truco: «¡eso no tiene relación con nada importante!».', original: 'SUSTITUYE en el Anki la trad explicación mejor por: 🧠 Truco: «¡Eso no tiene ninguna relación con nada importante!».'}
      - {kind: character, private: false, date: '2026-10-11', text: '关 «cerrar» y 系 «atar»: lo que está cerrado y atado a otra cosa tiene 关系, «relación». 关 sale solo en 关门 «cerrar la puerta».'}
    accept_cards: 'YAGO las confunde y pidió reforzarlas (review 009): elegir entre las cuatro respuestas hechas y un matiz corto.'
  - id: e.bukeqi
    use: say
    role: content
    kind: expression
    hanzi: 不客气
    pinyin: 'bù kèqi'
    meaning: {es: 'de nada', en: 'you''re welcome'}
    accept_pinyin_mismatch: 'la última sílaba es átona: kèqi (al hablar, 不 sube a bú)'
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'La respuesta a 谢谢. Literalmente, «no hagas cumplidos».'}
      - {kind: linguistic, private: false, date: '2026-10-06', text: 'Palabra a palabra: 客气 [HSK 5] es tener cumplidos, como un invitado 客; 不客气, «no hace falta cumplido». Su 气 qi no es el 起 qǐ de 对不起: son caracteres distintos.'}
    accept_cards: 'YAGO las confunde y pidió reforzarlas (review 009): elegir entre las cuatro respuestas hechas y un matiz corto.'
  - id: w.bang
    use: say
    role: content
    kind: word
    hanzi: 帮
    pinyin: 'bāng'
    meaning: {es: 'ayudar (a alguien)', en: 'to help'}
