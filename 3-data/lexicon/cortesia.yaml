    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Con la persona detrás: 帮我 «ayúdame». Es la forma corriente al hablar.'}
      - {kind: mnemonic, private: false, date: '2026-10-19', text: 'Una ciudad 阝 tan próspera 丰 que reparte telas 巾 a quien las necesita: eso es ayudar.', original: '«Una ciudad tan abundante y próspera que reparte telas entre quienes las necesitan para AYUDARLOS».'}
  - id: w.bangmang
    use: hear
    role: content
    kind: word
    hanzi: 帮忙
    pinyin: 'bāngmáng'
    meaning: {es: 'echar una mano', en: 'to give a hand'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'No lleva a quién detrás: 他来帮忙 «viene a echar una mano». «Ayúdame» es 帮我.'}
  - id: w.bangzhu
    use: hear
    role: content
    kind: word
    hanzi: 帮助
    pinyin: 'bāngzhù'
    meaning: {es: 'ayudar; ayuda', en: 'to help; help'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Más formal que 帮, y también sustantivo: 谢谢你的帮助 «gracias por tu ayuda».'}
  - id: g.bang
    kind: group
    basis: set
    title: 'Ayudar'
    explanation: 'Tres formas de ayudar; al hablar, la corriente es 帮. 帮忙 es tan básico como 帮 (los dos, HSK 1); 帮助, un poco más formal.'
    members:
      - {ref: w.bang, cue: 'con a quién detrás: 你可以帮我吗？'}
      - {ref: w.bangmang, cue: 'sin decir a quién: no lleva nada detrás'}
      - {ref: w.bangzhu, cue: 'también es nombre, y más formal: 谢谢你的帮助'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments: []
  - id: e.nizhenbang
    use: say
    role: content
    kind: expression
    hanzi: 你真棒
    pinyin: nǐ zhēn bàng
    meaning: {es: '¡eres genial!, ¡qué bien lo haces!', en: 'you are great!'}
    level: 2
    level_reason: elogio coloquial muy frecuente; 你 y 真 son HSK 1, 棒 suelto es más alto pero aquí va fijo
    source: {origin: class, batch: 004-2026-10-02-ser-nombres-y-describir, file: diapositivas 2026-09-29, date: '2026-09-29'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Palabra a palabra: 你 «tú» + 真 «de verdad» + 棒 «estupendo»: «eres estupendo de verdad».'}
  - id: e.nalinali
    use: drop
    use_reason: 'tradicional: YAGO quiere lo formal de trabajo o lo coloquial de la calle, no lo tradicional (review del lote 004). Hoy se contesta a un elogio con 谢谢.'
    role: content
    kind: expression
    hanzi: 哪里哪里
    pinyin: nǎlǐ nǎlǐ
    meaning: {es: '¡qué va!, no es para tanto (respuesta modesta a un elogio)', en: 'not at all (modest reply to praise)'}
    accept_pinyin_mismatch: se escribe con el tono de cita; al decirlo, el primer 哪 sube por el sandhi de tercer tono
    level: 2
    level_reason: respuesta fija a un elogio; 哪里 es HSK 1
    source: {origin: class, batch: 004-2026-10-02-ser-nombres-y-describir, file: diapositivas 2026-09-29, date: '2026-09-29'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-02', text: 'Respuesta modesta a 你真棒. Suena algo tradicional: hoy, sobre todo entre jóvenes, es más común contestar 谢谢.'}
  - id: e.zaishuoyibian
