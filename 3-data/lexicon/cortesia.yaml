    comments:
      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Palabra a palabra: 再 «otra vez» + 说 «decir» + 一遍 «una vez entera»: «dilo otra vez entero».'}
      - {kind: teacher, private: false, date: '2026-10-02', text: 'Lo que se dice en clase para pedir que repitan. Para leer otra vez, 再读一遍 zài dú yí biàn.'}
  - id: w.zhidao
