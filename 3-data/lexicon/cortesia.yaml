# Diccionario · Cortesía y respuestas. Esquema: 3-data/README.md

entries:
  - id: e.xiexie
    use: say
    role: content
    kind: expression
    hanzi: 谢谢
    pinyin: xièxie
    meaning: {es: gracias, en: thank you}
    register: neutral
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    frequency: {}
    relations: []
    accept_pinyin_mismatch: segunda sílaba en tono neutro en el habla estándar
    comments:
      - {kind: linguistic, private: false, date: 2026-09-25, text: 'La segunda 谢 se dice en tono neutro, corta y sin contorno propio.'}
  - id: w.qing
    use: say
    role: content
    kind: word
    hanzi: 请
    pinyin: qǐng
    meaning: {es: por favor, en: please}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments:
      - {kind: note, private: false, date: 2026-09-25, text: 'Fórmula cortés: 请您 + verbo, «le ruego que…». Por ejemplo, 请您进 qǐng nín jìn, «pase, por favor».', original: 'qǐng nín [verbo] = please you <do smth> (formal)'}
      - {kind: linguistic, private: false, date: '2026-09-27', text: '请 = 讠 «hablar» + 青 qīng, que da el sonido. La misma pista en 清 qīng «claro» [HSK 6], 晴 qíng «despejado» [HSK 2] y 情 qíng «sentimiento» [HSK 7]; lo que aporta 青 es el sonido, no un significado de «claridad».', original: 'verde azul da como claridad y speech claridad o algo asi ?'}
  - id: w.dui
    use: say
    role: content
    kind: word
    pos: adjetivo
    pos_reason: 'en el mazo es «correcto, eso es»; la lista lo da antes como preposición («hacia, para»)'
    hanzi: 对
    pinyin: duì
    meaning: {es: 'correcto; sí, eso es', en: 'right, correct'}
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments:
      - {kind: note, private: false, date: 2026-09-25, text: 'Variantes: 对啊 duì a, más natural en conversación, y 没错 méi cuò [HSK 4], más enfático («exacto»).', original: duì a / méi cuò (+ intenso)}
  - id: e.haode
    use: say
    role: content
    kind: expression
    hanzi: 好的
    pinyin: hǎo de
    meaning: {es: 'vale, de acuerdo', en: OK}
    level: 1
    level_reason: respuesta básica; 好 y 的 son HSK 1
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments:
      - {kind: note, private: false, date: 2026-09-25, text: 'Expresa acuerdo o conformidad: «vale», «muy bien», «de acuerdo».', original: 'subjetivo, muy bien, gusto'}
  - id: e.qingwen
    use: say
    role: content
    kind: expression
    hanzi: 请问
    pinyin: qǐngwèn
    meaning: {es: disculpe (para preguntar), en: excuse me (before asking)}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: '请 «por favor» + 问 wèn «preguntar»: la forma cortés de abrir una pregunta a alguien.'}
  - id: e.qingjin
    use: say
    role: content
    kind: expression
    hanzi: 请进
    pinyin: qǐng jìn
    meaning: {es: 'pase, por favor', en: 'come in, please'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments: []
  - id: e.qingzuo
    use: say
    role: content
    kind: expression
    hanzi: 请坐
    pinyin: qǐng zuò
    meaning: {es: 'siéntese, por favor', en: please sit down}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments: []
  - id: e.shide
    use: say
    role: content
    kind: expression
    hanzi: 是的
    pinyin: shì de
    meaning: {es: 'sí, eso es', en: 'yes, that''s right'}
    level: 1
    level_reason: respuesta afirmativa de cada día; 是 y 的 son HSK 1
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-29'}
    comments:
      - {kind: note, private: false, date: '2026-09-29', text: 'Sirve para confirmar, igual que 对 y 好的.', original: 'shi de = lo es  dui = exacte  (both are godo to confirm anthgin¿?)'}
  - id: w.en
    use: say
    role: content
    kind: word
    pos: interjeccion
    hanzi: 嗯
    pinyin: èn
    meaning: {es: 'mm, sí (asentimiento)', en: mm-hm (agreement)}
    level: 1
    level_reason: 'muletilla oral de asentimiento, muy frecuente al hablar'
    accept_pinyin_mismatch: 'como asentimiento se dice cayendo, èn; pypinyin da ń, la lectura de «¿eh?»'
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-29'}
    comments:
      - {kind: note, private: false, date: '2026-09-29', text: 'Se usa como 对: para asentir mientras el otro habla.', original: 嗯 as dui}
  - id: w.keyi
    use: say
    role: content
    kind: word
    hanzi: 可以
    pinyin: kěyǐ
    meaning: {es: 'poder (está permitido); vale, sirve', en: 'can, may; OK'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: note, private: false, date: '2026-09-29', text: 'También sirve de «vale», como 好的.', original: kê yî = okay (like ke ài) (its liek phnetical calco)}
      - {kind: linguistic, private: false, date: '2026-09-27', text: '可 delante de un verbo lo vuelve «-able»: 可以 «se puede», 可爱 «mono, adorable», 可怕 kěpà «temible» [HSK 2].'}
      - {kind: linguistic, private: false, date: '2026-10-01', text: '可以 no es «ser capaz» (eso es 能): es que algo está permitido, vale o sirve. Pregunta y respuesta a la vez: 可以吗？ —可以。 «¿Se puede? —Sí». En una tienda, 这个大小可以吗？ «¿este tamaño está bien?». Según el contexto también se dice 行 xíng [HSK 1] o 没问题 méi wèntí [问题 HSK 2], «no hay problema».', original: 'En kêyî hay que explcar que no es lo mismo poder tener permiso que 能 (néng): poder / ser capaz de. [...] keyi estaria bien hacer hincapie en que est tanto "poder" para preguntas como respuesta como ... loksea, y expresiones sinonimss segun ctx sabes'}
  - id: g.yes-forms
    kind: group
    basis: set
    title: Formas de decir que sí
    explanation: 'El chino no tiene un «sí» único: se confirma según lo que se responde.'
    members:
      - {ref: w.dui, cue: 'correcto, tienes razón'}
      - {ref: e.shide, cue: 'sí, eso es (confirma un hecho)'}
      - {ref: e.haode, cue: de acuerdo (aceptas algo)}
      - {ref: w.en, cue: 'mm, te sigo (mientras hablan)'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-29'}
    comments: []
  - id: e.buhaoyisi
    use: say
    role: content
    kind: expression
    hanzi: 不好意思
    pinyin: bù hǎoyìsi
    meaning: {es: 'perdona; qué vergüenza; me sabe mal', en: 'sorry, excuse me; how embarrassing'}
    accept_pinyin_mismatch: 'la última sílaba es átona: yìsi'
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Para una molestia pequeña: llegar tarde, pasar, interrumpir, pedir algo. Es muy cotidiano, también entre jóvenes, y no suena formal.'}
  - id: w.duibuqi
    use: say
    role: content
    kind: word
    hanzi: 对不起
    pinyin: duìbuqǐ
    accept_pinyin_mismatch: 'el 不 de en medio es átono en el habla: duìbuqǐ'
    meaning: {es: lo siento, en: "I'm sorry"}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Perdón de verdad, cuando has hecho algo mal: 对不起，我错了. Para una molestia pequeña basta 不好意思.'}
  - id: g.excuse
    kind: group
    basis: set
    title: 'Disculpe, perdona y lo siento'
    explanation: 'Tres formas de pedir perdón o de abordar a alguien, según la situación.'
    members:
      - {ref: e.qingwen, cue: 'antes de preguntar algo: 请问，饭店在哪里？'}
      - {ref: e.buhaoyisi, cue: 'una molestia pequeña: llegar tarde, pasar, pedir algo'}
      - {ref: w.duibuqi, cue: 'has hecho algo mal: lo siento'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat.md, date: '2026-10-01'}
    comments: []
  - id: e.meiguanxi
    use: say
    role: content
    kind: expression
    hanzi: 没关系
    pinyin: 'méi guānxi'
    meaning: {es: 'no pasa nada', en: 'it''s OK, never mind'}
    accept_pinyin_mismatch: 'la última sílaba es átona: guānxi'
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'La respuesta a 对不起 o a 不好意思: «no pasa nada». Literalmente, «no hay relación».'}
  - id: e.bukeqi
    use: say
    role: content
    kind: expression
    hanzi: 不客气
    pinyin: 'bù kèqi'
    meaning: {es: 'de nada', en: 'you''re welcome'}
    accept_pinyin_mismatch: 'la última sílaba es átona: kèqi (al hablar, 不 sube a bú)'
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'La respuesta a 谢谢. Literalmente, «no hagas cumplidos».'}
  - id: w.bang
    use: say
    role: content
    kind: word
    hanzi: 帮
    pinyin: 'bāng'
    meaning: {es: 'ayudar (a alguien)', en: 'to help'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Con la persona detrás: 帮我 «ayúdame». Es la forma corriente al hablar.'}
  - id: w.bangmang
    use: hear
    role: content
    kind: word
    hanzi: 帮忙
    pinyin: 'bāngmáng'
    meaning: {es: 'echar una mano', en: 'to give a hand'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'No lleva a quién detrás: 他来帮忙 «viene a echar una mano». «Ayúdame» es 帮我.'}
  - id: w.bangzhu
    use: hear
    role: content
    kind: word
    hanzi: 帮助
    pinyin: 'bāngzhù'
    meaning: {es: 'ayudar; ayuda', en: 'to help; help'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Más formal que 帮, y también sustantivo: 谢谢你的帮助 «gracias por tu ayuda».'}
  - id: g.bang
    kind: group
    basis: set
    title: 'Ayudar'
    explanation: 'Tres formas de ayudar; al hablar, la corriente es 帮.'
    members:
      - {ref: w.bang, cue: 'ayudar a alguien: 你可以帮我吗？'}
      - {ref: w.bangmang, cue: 'echar una mano, sin decir a quién'}
      - {ref: w.bangzhu, cue: 'ayudar o la ayuda, más formal: 谢谢你的帮助'}
    source: {origin: inbox, batch: 003-2026-10-01-comer-dinero-y-contrastes, file: sin-fecha_pegado-en-el-chat-2.md, date: '2026-10-01'}
    comments: []
  - id: e.nizhenbang
    use: say
    role: content
    kind: expression
    hanzi: 你真棒
    pinyin: nǐ zhēn bàng
    meaning: {es: '¡eres genial!, ¡qué bien lo haces!', en: 'you are great!'}
    level: 2
    level_reason: elogio coloquial muy frecuente; 你 y 真 son HSK 1, 棒 suelto es más alto pero aquí va fijo
    source: {origin: class, batch: 004-2026-10-02-ser-nombres-y-describir, file: diapositivas 2026-09-29, date: '2026-09-29'}
    comments: []
  - id: e.nalinali
    use: hear
    role: content
    kind: expression
    hanzi: 哪里哪里
    pinyin: nǎlǐ nǎlǐ
    meaning: {es: '¡qué va!, no es para tanto (respuesta modesta a un elogio)', en: 'not at all (modest reply to praise)'}
    accept_pinyin_mismatch: se escribe con el tono de cita; al decirlo, el primer 哪 sube por el sandhi de tercer tono
    level: 2
    level_reason: respuesta fija a un elogio; 哪里 es HSK 1
    source: {origin: class, batch: 004-2026-10-02-ser-nombres-y-describir, file: diapositivas 2026-09-29, date: '2026-09-29'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-02', text: 'Respuesta modesta a 你真棒. Suena algo tradicional: hoy, sobre todo entre jóvenes, es más común contestar 谢谢.'}
  - id: e.zaishuoyibian
    use: say
    role: content
    kind: expression
    hanzi: 再说一遍
    pinyin: zài shuō yí biàn
    meaning: {es: '¿puedes repetirlo?, dilo otra vez', en: 'say it again'}
    accept_pinyin_mismatch: '一 se lee yí delante de cuarto tono (遍 biàn)'
    level: 1
    level_reason: frase de clase desde el primer día; 再 y 说 son HSK 1 y 遍 solo aparece dentro de esta fórmula
    source: {origin: class, batch: 004-2026-10-02-ser-nombres-y-describir, file: diapositivas 2026-09-29, date: '2026-09-29'}
    comments:
      - {kind: teacher, private: false, date: '2026-10-02', text: 'Lo que se dice en clase para pedir que repitan. Para leer otra vez, 再读一遍 zài dú yí biàn.'}
