    pinyin: 'wàng'
    meaning: {es: 'olvidar', en: 'to forget'}
    source: {origin: inbox, batch: 006-2026-10-06-edad-numeros-y-familia, file: review-005-2026-10-05-saludos-y-sonidos.md, date: '2026-10-06'}
