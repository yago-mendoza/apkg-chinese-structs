  - id: w.tongshi
    use: say
    role: content
    kind: word
    hanzi: 同事
    pinyin: 'tóngshì'
    meaning: {es: 'compañero de trabajo', en: 'colleague'}
    source: {origin: class, batch: 011-2026-10-16-clase-primero-edad-y-opiniones, file: 'deberes 2026-10-13', date: '2026-10-13'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-13', text: '同 «mismo»: 同学 es quien estudia contigo y 同事, quien trabaja contigo.'}
      - {kind: linguistic, private: false, date: '2026-10-26', text: '同 es compartir algo: 同学 la clase, 同事 el trabajo, 同意 la idea, y 不同 bùtóng [HSK 2] es «distinto». 事 es un asunto que atender; 工, el trabajo técnico de 工作 y 工程师.', original: '同事 (tóngshì) = compañero de trabajo. 同学 (tóngxué) = compañero de clase. Literalmente es compartir _X_ Compartir algo'}
  - id: w.zhunbei
    use: say
    role: content
    kind: word
    hanzi: 准备
    pinyin: zhǔnbèi
    meaning: {es: 'preparar(se)', en: 'to prepare'}
    source: {origin: gaps, batch: 012-2026-10-19-querer-poder-y-matices, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-19'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Palabra a palabra: 准 «exacto» + 备 «tener listo». 你准备好了吗？ «¿estás listo?».'}
      - {kind: mnemonic, private: false, date: '2026-10-26', text: 'Las cabezas de la estantería 隹 se quedan sin hielo 冫 y se descongelan; voy con mis piernas 夂 al campo 田 y lo preparo para plantarlas.'}
      - {kind: linguistic, private: false, date: '2026-10-26', text: '准备 + verbo es «tener pensado, ir a»: 我们准备吃牛肉 «vamos a comer ternera», no «prepararla».', original: '我们准备吃牛肉。 Wǒmen zhǔnbèi chī niúròu. Vamos a preparar ternera.'}
  - id: w.diannao
    use: say
    role: content
    kind: word
    hanzi: 电脑
    pinyin: diànnǎo
    meaning: {es: 'ordenador', en: 'computer'}
    source: {origin: gaps, batch: 012-2026-10-19-querer-poder-y-matices, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-19'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Palabra a palabra: 电 «electricidad» + 脑 «cerebro»: el cerebro eléctrico.'}
      - {kind: mnemonic, private: false, date: '2026-10-26', text: '电: un sol con un cable del que sale electricidad. En 脑, 月 aquí es carne (una parte del cuerpo), y a la derecha, bajo una tapa 亠, unas conexiones cruzadas 乂 dentro del cráneo 凵.', original: 'Para memorizar 脑: carne 月 bajo una tapa 亠, con conexiones cruzadas 乂 dentro del cráneo 凵. […] La partr izquierda de ordenador es como un sol con un cable. Del que sale electricidad.'}
  - id: w.shangban
    use: say
    role: content
    kind: word
    hanzi: 上班
    pinyin: shàngbān
    meaning: {es: 'ir a trabajar, estar trabajando', en: 'to go to work'}
    source: {origin: gaps, batch: 012-2026-10-19-querer-poder-y-matices, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-19'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Palabra a palabra: 上 «subir, empezar» + 班 «turno». 我明天上班 «mañana trabajo». Al salir, 下班.'}
  - id: w.zhishi
    use: hear
    role: content
    kind: word
    hanzi: 知识
    pinyin: zhīshi
    meaning: {es: 'conocimiento, saber', en: 'knowledge'}
    accept_pinyin_mismatch: '识 suena átono en 知识 zhīshi, como en la diapositiva y al hablar'
    source: {origin: class, batch: 013-2026-10-23-pagar-opinar-y-contrastes, file: 'diapositivas 2026-10-23', date: '2026-10-23'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-23', text: 'Palabra a palabra: 知 «saber» (el de 知道) + 识 «conocer» (el de 认识).'}
      - {kind: mnemonic, private: false, date: '2026-10-26', text: '识, el de 认识 y 知识, es «reconocer»: el habla 讠 junto a algo que parece un caballete de pintor.', original: 'Shi de renshi o de zhishi es "reconocer" porque literal es lenguaje+loquepareceuncaballetedepintor.'}
  - id: w.shi.matter
    use: say
    role: content
    kind: word
    hanzi: 事
    pinyin: shì
    meaning: {es: 'asunto, cosa (que hacer)', en: 'matter, thing (to do)'}
    source: {origin: gaps, batch: 013-2026-10-23-pagar-opinar-y-contrastes, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-23'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-23', text: '我今天有事 «hoy tengo cosas que hacer». 没事 méi shì «no pasa nada, estoy bien».'}
  - id: w.xiaban
