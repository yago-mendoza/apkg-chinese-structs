    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: Literalmente «este y oeste». 买东西 mǎi dōngxi es «ir de compras». El 西 es el de 西班牙.}
      - {kind: mnemonic, private: false, date: '2026-09-27', text: '东: el sol 日 saliendo tras un árbol 木, por el este. 西: los pájaros vuelven al nido cuando el sol se pone, por el oeste.', original: 东 dōng = este / oriente. el sol saliendo sobre la copa de un árbol. 西 xī = oeste. nido → atardecer → oeste.}
