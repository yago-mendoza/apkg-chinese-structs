  - id: w.xuyao
    use: hear
    role: content
    kind: word
    hanzi: 需要
    pinyin: xūyào
    meaning: {es: necesitar, en: to need}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: '需要 es necesitar porque la situación lo impone; 要, querer o hacer falta. 我需要水 «necesito agua»; 我要水 «quiero agua».'}
      - {kind: mnemonic, private: false, date: '2026-09-27', text: '需: una persona bajo la lluvia 雨 que necesita resguardo.', original: una persona bajo la lluvia 雨 necesita protección}
  - id: g.want-like
    kind: group
    basis: set
    title: 'Querer, gustar, amar'
    explanation: Cuatro verbos que en español se cruzan. Cada uno pide un tipo de frase distinto.
    members:
      - {ref: w.xiang, cue: 'ganas de hacer algo: 我想喝水 (también «pensar»)'}
      - {ref: w.yao, cue: 'lo quiero, me hace falta: 我要水'}
      - {ref: w.xihuan, cue: 'me gusta, en general: 我喜欢咖啡'}
      - {ref: w.ai.love, cue: 'amo: 我爱你'}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments: []
  - id: w.piao
    use: hear
    role: content
    kind: word
    hanzi: 票
    pinyin: piào
    meaning: {es: 'billete, entrada', en: ticket}
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'Familia: 车票 chēpiào «billete de tren o autobús», 机票 jīpiào «billete de avión», 门票 ménpiào «entrada» [HSK 1]; 发票 fāpiào «factura» [HSK 4]; 投票 tóupiào «votar» [HSK 6]. En 发票 va 发 fā «emitir» (la factura se emite); en 投票, 投 tóu «lanzar, meter» (el voto se mete en la urna).'}
      - {kind: mnemonic, private: false, date: '2026-09-27', text: 'Un papel ritual que se quemaba: de ahí «billete»; sus cenizas flotando dan 漂 piāo «flotar», que presta el sonido a 漂亮.', original: papel ritual que se quema → billete; cenizas que vuelan → ligero}
  - id: w.jipiao
