      - {kind: mnemonic, private: false, date: '2026-09-27', text: '需: una persona bajo la lluvia 雨 que necesita resguardo.', original: una persona bajo la lluvia 雨 necesita protección}
  - id: g.want-like
    kind: group
    basis: set
    title: 'Querer, necesitar, gustar, amar'
    explanation: Verbos que en español se cruzan. Cada uno pide un tipo de frase distinto.
    members:
      - {ref: w.xiang, cue: 'ganas de hacer algo: 我想喝水'}
      - {ref: w.yao, cue: 'lo quiero, dame, tengo que: 我要水'}
      - {ref: w.xiangyao, cue: 'me gustaría tenerlo: 我想要这个'}
      - {ref: w.xuyao, cue: 'necesidad real, más fuerte que 要: 我需要水'}
      - {ref: w.xihuan, cue: 'me gusta, en general: 我喜欢咖啡'}
      - {ref: w.ai.love, cue: 'a personas, con fuerza: 我爱你'}
