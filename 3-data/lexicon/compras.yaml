    comments:
      - {kind: mnemonic, private: false, date: '2026-09-27', text: 'Unas manos que sujetan a una mujer por la cintura: desear.', original: originalmente unas manos sujetaban a una mujer por la cintura; de ahí pasó a idea de desear / querer.}
      - {kind: character, private: false, date: '2026-10-01', text: 'El carácter antiguo dibujaba una figura con las manos en la cintura: 要 era «cintura», que después pasó a escribirse 腰 yāo [HSK 4].'}
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'Además de «querer», 要 es «tener que» (我要工作 «tengo que trabajar») y «estar a punto de» (要下雨了 «va a llover»).'}
      - {kind: note, private: false, date: '2026-10-01', text: 'Se niega distinto que 有: 不要 «no quiero», 没有 «no tengo».', original: 'Queerer yào Y tener yôu Ponlos cerca de slguns forma que contrasten porwue los lio peinso siempre wue son los dos _O_ you you'}
    accept_cards: los huecos de 要 frente a 想, 想要, 需要, 不要 y 有 practican la confusión que señaló en el review 008
