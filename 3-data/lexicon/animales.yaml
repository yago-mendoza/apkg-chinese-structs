  - id: g.ma-ma
    kind: group
    basis: soundalike
    title: '吗 ma y 马 mǎ'
    explanation: 'La misma sílaba: 吗 es átona y cierra preguntas; 马 baja y sube. 马 da además el sonido a 吗 y a 妈.'
    members:
      - {ref: w.ma, cue: 'ma, átona: partícula de pregunta'}
      - {ref: w.ma.horse, cue: 'mǎ, baja y sube: caballo'}
    source: {origin: class, batch: 006-2026-10-06-edad-numeros-y-familia, file: diapositivas 2026-10-06, date: '2026-10-06'}
    comments: []
