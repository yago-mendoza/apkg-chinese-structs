# Diccionario · Entender y preguntar. Esquema: 3-data/README.md

entries:
  - id: w.wenti
    use: say
    role: content
    kind: word
    hanzi: 问题
    pinyin: wèntí
    meaning: {es: pregunta; problema, en: question; problem}
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Palabra a palabra: 问 «preguntar» + 题 «tema, ejercicio». Es «pregunta» y también «problema»: 我有一个问题 «tengo una pregunta»; 没问题 «no hay problema».'}
      - {kind: character, private: false, date: '2026-10-11', text: '题 lleva 是 a la izquierda, que le daba el sonido (hoy ya no se parece: tí), y 页 «página» a la derecha.', original: EN MEI WENTI EL 'tí' es shì hanzi + yè hanzi (pagína de libro o clasificador)}
  - id: w.dong
    use: say
    role: content
    kind: word
    hanzi: 懂
    pinyin: dǒng
    meaning: {es: 'entender, comprender', en: to understand}
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Solo es verbo: 我懂了 «ya lo entiendo»; 听不懂 «no lo entiendo (al oírlo)». 明白 es lo mismo, y además puede ser adjetivo, «claro»: 很明白 «muy claro».'}
  - id: w.yisi
    use: say
    role: content
    kind: word
    hanzi: 意思
    pinyin: yìsi
    meaning: {es: 'significado, sentido', en: meaning}
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: '这个是什么意思？ «¿qué significa esto?». Es el mismo 意思 de 不好意思, literalmente «no es buena intención».'}
      - {kind: mnemonic, private: false, date: '2026-10-21', text: '意: una voz 音 que sale del corazón 心: una intención. 思: un campo 田 de ideas cultivado en el corazón 心: pensar.'}
      - {kind: linguistic, private: false, date: '2026-10-21', text: '什么意思？ «¿qué significa?»; 我的意思是… «lo que quiero decir es…». 你是什么意思？ puede sonar desafiante; para preguntar sin tensión, 你是说…？ «¿quieres decir que…?». 意 y 思 casi nunca van solos.'}
    accept_pinyin_mismatch: '思 va en tono neutro en el habla: yìsi'
  - id: w.qingchu
    use: say
    role: content
    kind: word
    hanzi: 清楚
    pinyin: qīngchu
    meaning: {es: 'claro, nítido (que se ve o se oye bien)', en: clear}
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: '我没听清楚 «no lo he oído bien»: el problema es el sonido, no entenderlo. 清 lleva 青 qīng, que le da el sonido, como a 请 qǐng.'}
    accept_pinyin_mismatch: '楚 va en tono neutro en el habla: qīngchu'
  - id: w.du
    use: say
    role: content
    kind: word
    hanzi: 读
    pinyin: dú
    meaning: {es: leer (en voz alta), en: to read (aloud)}
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: '这个字怎么读？ «¿cómo se lee este carácter?». Leer para uno mismo, en silencio, también es 看: 看书 «leer un libro».'}
  - id: w.man
    use: say
    role: content
    kind: word
    hanzi: 慢
    pinyin: màn
    meaning: {es: 'lento, despacio', en: slow}
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: '请说慢一点 «hable un poco más despacio, por favor». Lo contrario es 快 kuài «rápido».'}
  - id: w.yidian
    use: say
    role: function
    kind: word
    hanzi: 一点
    pinyin: yīdiǎn
    meaning: {es: un poco (de una cantidad o de una cualidad), en: a little}
    level: 1
    level_reason: 'Es 一点儿, HSK 1, sin el erhua del norte: en mandarín estándar se dice y se escribe 一点.'
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Va detrás de un adjetivo para pedir «un poco más así»: 慢一点 «más despacio», 便宜一点 «más barato». «Un poco» de una acción es 一下: 等一下.'}
      - {kind: linguistic, private: false, date: '2026-10-22', text: 'Delante de un nombre, «un poco de»: 一点水. Detrás de un verbo, «un poco»: 吃一点. Con 有 delante del adjetivo es una queja: 有点贵 «es un poco caro», frente a 贵一点 «un poco más caro». Lo contrario de 一点 es 很多.'}
    pos: adverbio
    pos_reason: 'Detrás de un adjetivo, «un poco (más)»: 慢一点.'
  - id: w.zheyang
    use: say
    role: content
    kind: word
    hanzi: 这样
    pinyin: zhèyàng
    meaning: {es: 'así, de esta manera', en: 'like this, this way'}
    source: {origin: inbox, batch: 010-2026-10-11-construir-numeros-y-movimiento, file: review-009-2026-10-10-situaciones-huecos-y-contrastes.md, date: '2026-10-11'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: '这样说对吗？ «¿se dice así?». 那样 nàyàng es «así, como eso».'}
  - id: w.shuohua
    use: say
    role: content
    kind: word
    hanzi: 说话
    pinyin: shuōhuà
    meaning: {es: hablar (con alguien), en: to talk}
    source: {origin: review, batch: 012-2026-10-19-querer-poder-y-matices, file: review-011-2026-10-16-clase-primero-edad-y-opiniones.md, date: '2026-10-19'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Palabra a palabra: 说 «decir» + 话 «palabras»: hablar, sin decir de qué. Con un idioma va 说 solo: 说中文. 别说话 «no hables», «calla».'}
  - id: w.liaotian
    use: say
    role: content
    kind: word
    hanzi: 聊天
    pinyin: liáotiān
    meaning: {es: charlar, en: to chat}
    level: 2
    level_reason: 'no está en la lista del HSK 3.0, pero es como se dice charlar a diario (y en los mensajes); 天 es HSK 1'
    pos: verbo
    pos_reason: no está en la lista del HSK
    source: {origin: review, batch: 012-2026-10-19-querer-poder-y-matices, file: review-011-2026-10-16-clase-primero-edad-y-opiniones.md, date: '2026-10-19'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Palabra a palabra: 聊 «charlar» + 天 «cielo, día»: hablar del tiempo, de cualquier cosa. 跟你聊天 «charlar contigo».'}
  - id: w.gaosu
    use: say
    role: content
    kind: word
    hanzi: 告诉
    pinyin: gàosu
    meaning: {es: 'decir (a alguien), contar', en: 'to tell'}
    accept_pinyin_mismatch: '诉 va en tono neutro: gàosu'
    source: {origin: gaps, batch: 012-2026-10-19-querer-poder-y-matices, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-19'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Con la persona detrás: 告诉我 «dime», 请告诉我 «dímelo, por favor». 说 dice algo; 告诉 se lo cuenta a alguien.'}
  - id: w.jide
    use: say
    role: content
    kind: word
    hanzi: 记得
    pinyin: jìde
    meaning: {es: 'acordarse, recordar', en: 'to remember'}
    accept_pinyin_mismatch: '得 va en tono neutro: jìde'
    source: {origin: gaps, batch: 012-2026-10-19-querer-poder-y-matices, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-19'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: 'Palabra a palabra: 记 «apuntar en la memoria» + 得 «lograr». 你还记得我吗？ «¿te acuerdas de mí?». Lo contrario, 忘记.'}
  - id: w.wangji
    use: say
    role: content
    kind: word
    hanzi: 忘记
    pinyin: wàngjì
    meaning: {es: 'olvidar', en: 'to forget'}
    source: {origin: gaps, batch: 012-2026-10-19-querer-poder-y-matices, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-19'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-19', text: '我忘记了 «se me ha olvidado». Al hablar se oye mucho 忘了 a secas.'}
  - id: w.hua.words
    use: say
    role: content
    kind: word
    hanzi: 话
    pinyin: huà
    meaning: {es: 'palabras, lo que se dice', en: 'words, what is said'}
    source: {origin: gaps, batch: 013-2026-10-23-pagar-opinar-y-contrastes, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-23'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-23', text: 'El mismo 话 de 说话 «hablar» y 电话 «teléfono»: 我不明白他的话 «no entiendo lo que dice».'}
  - id: w.biede
    use: say
    role: function
    kind: word
    hanzi: 别的
    pinyin: biéde
    meaning: {es: 'otro, otra cosa', en: 'other, something else'}
    source: {origin: gaps, batch: 013-2026-10-23-pagar-opinar-y-contrastes, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-23'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-23', text: '我想看看别的 «quiero ver otra cosa». No confundir con 别 «no (lo hagas)».'}
  - id: w.o.interj
    use: hear
    role: function
    kind: word
    hanzi: 哦
    pinyin: ò
    meaning: {es: '¡ah!, ya veo', en: 'oh, I see'}
    connection: {kind: sound, with: [我], text: '我 wǒ da el sonido a 哦 ò: la boca 口 dice «¡oh!».'}
    use_reason: 'interjección de la clase (哦，你属什么？); la lista la pone en HSK 7, pero se oye en cualquier conversación'
    source: {origin: class, batch: 013-2026-10-23-pagar-opinar-y-contrastes, file: 'diapositivas 2026-10-23', date: '2026-10-23'}
    comments: []
  - id: g.hua-hua
    kind: group
    basis: soundalike
    title: 话 huà y 花 huā
    explanation: 'La misma sílaba: 话 cae; 花 es alto y plano.'
    members:
      - {ref: w.hua.words, cue: 'cae: 说话, 电话'}
      - {ref: w.hua.flower, cue: 'alto y plano'}
    source: {origin: review, batch: 013-2026-10-23-pagar-opinar-y-contrastes, file: review-012-2026-10-19-querer-poder-y-matices.md, date: '2026-10-23'}
    comments: []
  - id: w.kandao
    use: say
    role: content
    kind: word
    hanzi: 看到
    pinyin: kàndào
    meaning: {es: 'ver (llegar a ver)', en: 'to see, to catch sight of'}
    source: {origin: gaps, batch: 013-2026-10-23-pagar-opinar-y-contrastes, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-23'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-23', text: 'Palabra a palabra: 看 «mirar» + 到 «llegar»: mirar y conseguirlo. 我看到你了！ «¡te he visto!».'}
  - id: w.tingdao
    use: say
    role: content
    kind: word
    hanzi: 听到
    pinyin: tīngdào
    meaning: {es: 'oír (llegar a oír)', en: 'to hear'}
    source: {origin: gaps, batch: 013-2026-10-23-pagar-opinar-y-contrastes, file: 'propuesta del agente: HSK 1 por frecuencia', date: '2026-10-23'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-23', text: 'Como 看到: 听 «escuchar» + 到 «llegar». 你听到了吗？ «¿lo has oído?».'}
