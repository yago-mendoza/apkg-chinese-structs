    comments:
      - {kind: mnemonic, private: false, date: '2026-09-27', text: '疒 «enfermedad» + 叟 «anciano»: un anciano enfermo, flaco.', original: cuerpo enfermo de un anciano → flaco}
      - {kind: character, private: false, date: '2026-09-27', text: '叟 sǒu «anciano» da un sonido parecido: shòu. 疒 es la pieza de las enfermedades: una cama con una persona tumbada.'}
