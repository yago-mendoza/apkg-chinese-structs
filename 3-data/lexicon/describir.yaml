  - id: g.ben-ben
    kind: group
    basis: soundalike
    title: '本 běn / 笨 bèn'
    explanation: 'Casi iguales al oído: 本 běn (tercer tono) cuenta libros y 笨 bèn (cuarto tono) es «torpe». Además 本 da el sonido a 笨, que es 竹 sobre 本.'
    members:
      - {ref: w.ben.book, cue: 'běn, baja y sube: clasificador de libros'}
      - {ref: w.ben, cue: 'bèn, cae: torpe'}
    source: {origin: class, batch: 004-2026-10-02-ser-nombres-y-describir, file: diapositivas 2026-09-29, date: '2026-09-29'}
