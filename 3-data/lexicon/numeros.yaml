  - id: w.ge
    use: say
    role: function
    kind: word
    hanzi: 个
    pinyin: ge
    meaning: {es: clasificador general (uno de algo), en: general measure word}
    accept_pinyin_mismatch: 'clasificador átono: se dice ge'
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: linguistic, private: false, date: '2026-09-27', text: 'Entre el número y la cosa: 三个朋友 «tres amigos».'}
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'El clasificador no se omite: sin él la frase se entiende, pero suena tan mal como «yo tener tres amigo». A veces informa de la forma: 张 zhāng [HSK 3] para cosas planas, 条 tiáo [HSK 2] para alargadas. Van sin clasificador las palabras que ya son unidad, como 天 y 年: 三天 «tres días», 两年 «dos años».'}
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Además de con números, el clasificador va detrás de 这, 那, 哪, 每 [HSK 3] y 几: 那个人 «esa persona», 哪本书？ «¿qué libro?», 几个人？ «¿cuántas personas?». Pero 这 solo, «esto», no lo lleva: 这是书 «esto es un libro».'}
