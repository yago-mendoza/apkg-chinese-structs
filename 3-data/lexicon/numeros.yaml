    comments:
      - {kind: linguistic, private: false, date: '2026-10-02', text: 'Un árbol 木 con una raya en la raíz: su sentido original es «raíz, origen». Como clasificador, cuenta libros.'}
      - {kind: teacher, private: false, date: '2026-10-02', text: 'Como 个 para personas, 本 para libros: 一个人 «una persona», 一本书 «un libro».'}
  - id: w.ke
