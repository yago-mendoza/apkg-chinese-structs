    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Número + 点: 三点 «las tres». 现在几点？ «¿qué hora es?». Delante va la parte del día: 早上七点 «las siete de la mañana», 下午五点 «las cinco de la tarde».'}
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Es el mismo 点 de la coma decimal: 三点五 «tres coma cinco». En la hora, lo que sigue son minutos: 三点五分 «las tres y cinco».'}
