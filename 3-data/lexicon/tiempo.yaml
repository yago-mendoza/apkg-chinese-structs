  - id: g.wu-day-parts
    kind: group
    basis: pattern
    title: 上 / 中 / 下 + 午
    piece: c.wu.noon
    explanation: 午 es el mediodía; 上 lo pone antes, 中 en el centro y 下 después.
    members:
      - {ref: w.shangwu, cue: 上 antes del mediodía}
      - {ref: w.zhongwu, cue: 中 en medio}
      - {ref: w.xiawu, cue: 下 después del mediodía}
    source: {origin: class, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: '2026-09-21'}
    comments: []
  - id: g.day-parts
    kind: group
    basis: set
    title: Partes del día
    explanation: Con 午 «mediodía» se forman las tres del centro (上 antes, 中 en, 下 después); la noche va aparte.
    members:
      - {ref: w.shangwu, cue: '上 «arriba, antes» + 午'}
      - {ref: w.zhongwu, cue: 中 «en medio» + 午}
      - {ref: w.xiawu, cue: '下 «abajo, después» + 午'}
      - {ref: w.wanshang, cue: '晚 «tarde, noche»; sin 午'}
    timeline:
      - {ref: w.zaoshang, from: 5, to: 9}
      - {ref: w.shangwu, from: 8, to: 12}
      - {ref: w.zhongwu, from: 12, to: 14}
      - {ref: w.xiawu, from: 14, to: 18}
      - {ref: w.wanshang, from: 18, to: 24}
    source: {origin: class, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-07-12.txt, date: '2026-09-23'}
    comments: []
