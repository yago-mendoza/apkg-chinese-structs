    comments:
      - {kind: linguistic, private: false, date: '2026-10-01', text: 'El tiempo que tienes, no el que hace (eso es 天气): 我没有时间 «no tengo tiempo».'}
      - {kind: linguistic, private: false, date: '2026-10-11', text: '时间 es el tiempo que tienes: 我没有时间 «no tengo tiempo». Lo que dura mucho es 久: 好久不见 «¡cuánto tiempo!». Lo que dura algo se pregunta con 多久.'}
      - {kind: character, private: false, date: '2026-10-11', text: '间 es el sol 日 que entra por una puerta 门: el hueco entre dos cosas, en el espacio o en el tiempo. Por eso también es «sala»: 房间, 洗手间.'}
