    comments:
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Toda la mañana, hasta el mediodía: 上午十一点 «las once de la mañana». La primera hora es 早上. En catalán: 上午, el matí; 早上, la matinada.'}
