      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Los días son 星期 + número: 星期一 «lunes» … 星期六 «sábado». El domingo no lleva número: 星期天, o 星期日 por escrito.'}
      - {kind: mnemonic, private: false, date: '2026-10-11', text: '星期 es «el periodo de la estrella»: 星期四, el periodo de la estrella cuatro.', original: Y ademas pa recorfsr mejor losnfis son "Estrella periodo numero" Estrella del periodo X}
      - {kind: mnemonic, private: false, date: '2026-10-11', text: '星 se parece a 青 dado la vuelta: en 星, el sol 日 arriba y 生 abajo; en 青, lo de arriba se parece a 生 y abajo va 月.', original: Que btw se parece a qing pero al reves encuma la parte gruesa y abajo}
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Los días van al revés que los meses: 星期 + número (星期四 «jueves»); los meses, número + 月 (十一月 «noviembre»). El domingo no es «星期七»: 星期天, o 星期日 por escrito.'}
