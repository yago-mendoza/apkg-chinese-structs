  - id: w.li.inside
    use: say
    role: function
    kind: word
    pos: sustantivo
    pos_reason: 'aquí es «dentro», una palabra de lugar; la lista lo da también como clasificador (li, medida de distancia)'
    hanzi: 里
    pinyin: 'lǐ'
    meaning: {es: 'dentro, en (detrás de un lugar)', en: 'inside, in'}
    source: {origin: inbox, batch: 008-2026-10-08-pedir-ayuda-lugares-y-finales, file: review-007-2026-10-07-fechas-ordinales-y-clasificadores.md, date: '2026-10-08'}
