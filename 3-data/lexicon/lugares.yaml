    comments:
      - {kind: linguistic, private: false, date: '2026-10-08', text: 'Palabra a palabra: 机 «avión» (de 飞机) + 场 «explanada».'}
      - {kind: teacher, private: false, date: '2026-10-08', text: 'En clase: 她在机场。 «Está en el aeropuerto.»'}
  - id: w.ditie
