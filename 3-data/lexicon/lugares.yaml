  - id: w.hui.return
    use: say
    role: content
    kind: word
    hanzi: 回
    pinyin: huí
    meaning: {es: volver (a un sitio), en: to return}
    source: {origin: inbox, batch: 009-2026-10-10-situaciones-huecos-y-contrastes, file: review-008-2026-10-08-pedir-ayuda-lugares-y-finales.md, date: '2026-10-09'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-09', text: '回家 «volver a casa», 回来 «volver aquí». No confundir con 会 huì, que cae: 我会回来 «volveré».'}
      - {kind: mnemonic, private: false, date: '2026-10-11', text: '回 parece la marca de la base en el minimapa de un videojuego: volver a la base. O una boca dentro de otra que grita «¡vuelve!».', original: 'mnemotenica para el hanz ide volver, es como una marca de minimapa del call of duty, volver a al base, base, parece una base, sabes, volver. o tmaibne parece nua boca dentro de otra gritnado, VOLVER !!!'}
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Con un destino, 回 va solo: 回家 «volver a casa», 回中国 «volver a China». Sin destino lleva 来 o 去, que dicen hacia dónde: 他回来了 «ha vuelto (aquí)», 我要回去了 «tengo que volver (allí)».', original: 'ademsa volver aparece imsepre como huilai, hui solo enciesta el ''le'' para volver al igual que habitiacon necesita el ''espacio'' para ser habitaicon sabesa'}
