  - id: w.fangjian
    use: say
    role: content
    kind: word
    hanzi: 房间
    pinyin: 'fángjiān'
    meaning: {es: 'habitación', en: 'room'}
    source: {origin: inbox, batch: 008-2026-10-08-pedir-ayuda-lugares-y-finales, file: review-007-2026-10-07-fechas-ordinales-y-clasificadores.md, date: '2026-10-08'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-08', text: 'Con un lugar, 在 + sitio + 里: 我在房间里 «estoy en la habitación».'}
      - {kind: linguistic, private: false, date: '2026-10-11', text: 'Palabra a palabra: 房 «casa» + 间 «sala, espacio». El chino suele precisar con una segunda pieza: 洗手间 es «la sala de lavarse las manos». 空间 kōngjiān [HSK 4] es «espacio».', original: 'CLARO Y YO AUQ IDIRIA ,peor porque o solo fàng si ya es hab ... porque fáng es habiticaon is pero como competne entonces par ocnifmar que es la palabra, en efecto, usamos el jian, fangjian, habitacon como espacio'}
  - id: w.dadianhua
    use: say
