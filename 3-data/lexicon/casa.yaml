  - id: w.bingxiang
    use: say
    role: content
    kind: word
    hanzi: 冰箱
    pinyin: 'bīngxiāng'
    meaning: {es: 'nevera', en: 'fridge'}
    source: {origin: class, batch: 008-2026-10-08-pedir-ayuda-lugares-y-finales, file: diapositivas 2026-10-08, date: '2026-10-08'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-08', text: 'Palabra a palabra: 冰 «hielo» + 箱 «caja»: «caja de hielo».'}
      - {kind: teacher, private: false, date: '2026-10-08', text: 'En clase: 这是一个冰箱。 «Esto es una nevera.» 个 es su clasificador.'}
      - {kind: character, private: false, date: '2026-10-08', text: '相 xiāng da el sonido a 箱 xiāng y a 想 xiǎng; ⺮ «bambú» da el sentido de 箱: las cajas eran de bambú.'}
