    source: {origin: class, batch: 008-2026-10-08-pedir-ayuda-lugares-y-finales, file: diapositivas 2026-10-08, date: '2026-10-08'}
    comments:
      - {kind: linguistic, private: false, date: '2026-10-08', text: '钟 es el reloj de pared o el de una torre; el de pulsera es 手表.'}
  - id: w.shoubiao
