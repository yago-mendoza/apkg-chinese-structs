    comments:
      - {kind: linguistic, private: false, date: '2026-10-08', text: 'Palabra a palabra: 手 «mano» + 表 «indicador». Dos terceros tonos: se dice shóubiǎo.'}
      - {kind: teacher, private: false, date: '2026-10-08', text: 'En clase: 我没有手表。 «No tengo reloj.»'}
      - {kind: sound, private: false, date: '2026-10-08', text: 'En biǎo, la a bien marcada y la o floja.', original: 'shoubiao, la a es pija  y la o floja'}
