      - {kind: note, private: false, date: 2026-09-25, text: '认 «reconocer» + 识 «distinguir»: conocer a alguien, estar familiarizado con algo.', original: 认识 = reconocer + distinguir = familiarizado con}
      - {kind: note, private: false, date: 2026-09-25, text: 识 aporta la idea de distinguir algo de lo demás porque se conoce., original: distinguir algo (de los demás) con conocimiento}
