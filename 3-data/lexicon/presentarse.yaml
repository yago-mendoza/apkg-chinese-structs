  - id: w.yage
    use: say
    role: content
    kind: word
    hanzi: 雅戈
    pinyin: Yǎgē
    meaning: {es: Yago (mi nombre en chino), en: Yago (my Chinese name)}
    level: 1
    level_reason: 'mi nombre: lo necesito desde el primer día'
    source: {origin: inbox, batch: 002-2026-09-29-clima-apellidos-y-caracteres, file: mixto_29_y_hoy la de hace 2 dias.md, date: '2026-09-27'}
    comments:
      - {kind: note, private: false, date: '2026-09-27', text: 'Transcripción por el sonido: 雅 «elegante» y 戈 «alabarda», sin otro significado. Solo por diversión.', original: 'yage mendousa (yage = alabarda refinada) - no sginfinca nada adifenirac del nombre, es pura transcripcion for the fun of it.'}
