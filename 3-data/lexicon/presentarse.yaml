      - {kind: linguistic, private: false, date: '2026-10-07', text: 'Palabra a palabra: 贵 «valioso, honorable» + 姓 «apellido»: «su honorable apellido».'}
      - {kind: teacher, private: false, date: '2026-09-29', text: 您贵姓？ es la forma respetuosa de 你姓什么？ Se contesta con el apellido o con el nombre completo., original: nin gui xing -> wo jiao bai da long}
      - {kind: teacher, private: false, date: '2026-10-01', text: '您贵姓？ es para situaciones formales, como el trabajo o los negocios. Sabiendo el apellido, se le llama con 先生 (白先生，您好) y no por el nombre completo.'}
