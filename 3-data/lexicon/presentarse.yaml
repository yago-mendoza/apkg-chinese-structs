    comments:
      - {kind: linguistic, private: false, date: '2026-09-29', text: '是 une dos nombres (我是学生), no un nombre con un adjetivo: 我很高, no 我是高. Para preguntar vale 她漂亮吗？ o 她是不是很漂亮？, pero no 她是漂亮吗？.'}
