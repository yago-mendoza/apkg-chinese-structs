    comments:
      - {kind: mnemonic, private: false, date: '2026-10-19', text: 'Ves varias cosas y abres la boca 口 para preguntar: «¿cuál de esas 那 quieres?». La boca convierte «ese» en una pregunta, y el tono también cambia: 那 nà baja, 哪 nǎ baja y sube.', original: 'Mnemotecnia: imagina que ves varias cosas y usas tu boca (口) para preguntar: «¿CUÁL de esas (那) quieres?». Así recordarás que 口 + 那 = 哪, y que al añadir la boca conviertes «ese» en una pregunta: «¿cuál?». Recuerda también el cambio de tono: nà (4.º tono) → nǎ (3.º tono).'}
