  - id: w.xibanya
    use: say
    role: content
    kind: word
    hanzi: 西班牙
    pinyin: Xībānyá
    meaning: {es: España, en: Spain}
    level: 1
    level_reason: 'mi país: lo necesito desde el primer día'
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: 2026-09-25}
    comments:
      - {kind: linguistic, private: false, date: 2026-09-25, text: 'Transcripción fonética: los caracteres imitan el sonido, no el significado.'}
      - {kind: linguistic, private: false, date: '2026-09-27', text: 西 xī «oeste» es el mismo de 东西 dōngxi «cosas».}
  - id: w.meiguo
    use: hear
    role: content
    kind: word
    hanzi: 美国
    pinyin: Měiguó
    meaning: {es: Estados Unidos, en: United States}
    level: 1
    level_reason: nombre de país frecuente; 国 es HSK 1
    source: {origin: inbox, batch: 001-2026-09-25-primeras-clases, file: sin-fecha_hojas-01-06.txt, date: 2026-09-25}
    comments:
      - {kind: mnemonic, private: false, date: '2026-09-27', text: '美: 大 «persona» con 羊 «carnero» encima, como adorno de cuernos: bello.'}
      - {kind: linguistic, private: false, date: '2026-09-27', text: '美国 es en parte transcripción: 美 měi imita el sonido de «América» y de paso significa «bello».'}
