# Frases y ejercicios. Una frase se guarda una vez y se referencia.
# type: read | listen | tones | cloze | produce | speak   (ver README, repertorio)
# targets: lo que se evalúa. context: vocabulario visible en la pregunta.
# reveal: frases que solo aparecen al revelar la respuesta.
# frases: use (say = frase modelo; hear = de ejemplo) y theme.
# added: fecha de creación; decide el subdeck mensual (🐉 Chino práctico::AAAA-MM). No cambiarla.
# answer.typed: respuesta tecleada en pinyin numérico (he1, ni3 hao3, 5 = neutro)
#   o, en ejercicios de tonos, solo un dígito por sílaba (什么 → '25', entre comillas).
#   Sin typed, la tarjeta es de autoevaluación.

version: 1

sentences:
  - id: s.ni-he-shui-ma
    use: say
    theme: compras
    segments:
      - {text: 你, ref: w.ni, pinyin: nǐ}
      - {text: 喝, ref: w.he.drink, pinyin: hē}
      - {text: 水, ref: w.shui, pinyin: shuǐ}
      - {text: 吗, ref: w.ma, pinyin: ma}
      - {text: ？}
    translation: {es: '¿Bebes agua?', en: 'Do you drink water?'}

