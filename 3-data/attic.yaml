    notes:
      - {text: '票 piào «billete, papel» da el sonido y el sentido: el papel que se emite (发) al pagar.'}
    snooze: 003-2026-10-01-comer-dinero-y-contrastes
    snooze_reason: 'despierta con 钱, pero es HSK 4; entra cuando lleguen pagar y la cuenta (买单, 付钱)'
