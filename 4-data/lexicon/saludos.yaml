      - {ref: e.nihao, cue: una persona; neutro}
      - {ref: e.ninhao, cue: una persona mayor o de respeto (您)}
      - {ref: e.nimenhao, cue: un grupo que tienes delante; relajado}
      - {ref: e.dajiahao, cue: todo el mundo; más amplio y formal}
